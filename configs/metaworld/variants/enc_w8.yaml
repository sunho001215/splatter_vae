# Encoder pilot w8 (2026-10-25; a pilot, not the frozen method): width 256 at depth 8 on top of chamfer_lean_randmask
# (job config list: base, task, chamfer_lean.yaml, chamfer_lean_randmask.yaml, this file).
# Width 256, depth 8, 4 heads (head dimension 64), MLP 1024 (mlp_ratio 4). slot_dim stays 256 (slot_proj =
# Linear(256, 256)); patch 16, the decoder (width 128), every loss and the learning rate are unchanged.
# Pre-registered fallback (this arm and w4 only): divergence within the first 20k steps -> one restart with
# train.encoder_lr_mult 0.6 (runs/setup/encp-definition-20261025.json).
model:
  encoder:
    width: 256
    depth: 8
    heads: 4
