# Variant action_future (registered 2026-10-20; not the frozen method): action-conditioned future prediction.
# Encoder input: RGB frames (t-2k, t-k, t); targets: frames (t, t+k, t+2k), k in data.strides; the decoder's dynamic
# displacement heads also take the recorded actions[t:t+2k]. Everything else is the frozen method method-frozen-v1
# (C + D0 + M3D): its four registered overrides are repeated here, so this file plus base.yaml + task reproduces it
# with only the objective and the action branch changed. The RL-time encoder input and architecture are unchanged.
data:
  objective: future
aug:
  synth_views: 2
  synth_render: true
loss:
  depth_valid_far: true
  motion_space: gaussian
model:
  decoder:
    action_dim: 4        # Meta-World actions (verified: dataset action arrays are (T, 4))
    max_actions: 12      # 2k for k = 6
    action_hidden: 128   # prefix MLP 61 -> 128 -> 64
    action_embed: 64
