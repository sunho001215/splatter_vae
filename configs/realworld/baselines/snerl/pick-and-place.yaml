# snerl pretraining on the REAL-WORLD pick-and-place store (generated by s4d/rwlearn/configs.py; do not
# edit by hand). Base: configs/baselines/snerl/drawer-open.yaml (accepted Meta-World protocol);
# every other key is the documented protocol value. Overrides and reasons:
#   dataset.hdf5_path = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/store.yaml: for source realworld this key holds the FrameStore descriptor (s4d/rwlearn/store.py; compact per-camera training store, centre crop 128 px), not an HDF5 file; the trainers pass it through unchanged
#   data_interface.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/split_seed0.json: seeded per-task 90/10 EPISODE-level split, fixed and recorded (s4d/rwlearn/store.py::split_episodes, seed 0); validation episodes are never trained on
#   data_interface.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/gate_report.json: full-data gate evidence (s4d/rwlearn/gate.py); runs > 10k steps refuse without a passed report whose episode sets equal the store's
#   data_interface.consumer = snerl: GEOMETRY-DEPENDENT consumer (s4d/rwlearn/gate.py CONSUMERS): also needs the calibration hold released (calibration_validated per episode) and a store built from the validated calibration
#   data_interface.source = realworld: selects the real-world dataset classes (per-episode cameras, loader-side sync, run-bounded windows)
#   data_interface.target = pick-and-place: task(s) in the store
#   data_interface.lookat = None: NOT MEASURED for this task (TODO): measure with store.scene_statistics on its validated processed episodes (docs/realworld_baselines.md); null on purpose, the planner refuses this baseline until then
#   data_interface.pose_scale = None: NOT MEASURED for this task (TODO): measure with store.scene_statistics on its validated processed episodes (docs/realworld_baselines.md); null on purpose, the planner refuses this baseline until then
#   dataset.num_inputs = 3: 3 input cameras (user decision 2026-11-06): the rig has exactly 3, so every training target view is also an input view (Meta-World: 3 of 6). Validation (separate episodes) reports input-view reconstruction and leave-one-camera-out novel-view reconstruction separately (s4d/rwlearn/snerl_eval.py)
# Plan rows only through scripts/realworld_learning.py plan (full-data gate); see docs/realworld_baselines.md.
dataset:
  hdf5_path: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/store.yaml
  num_inputs: 3
  num_workers: 4
  prefetch_factor: 4
nerf:
  dataset_type: blender
  no_batching: true
  use_viewdirs: true
  white_bkgd: false
  lrate_decay: 500
  N_samples: 64
  N_importance: 128
  N_rand: 1024
  precrop_iters: 500
  precrop_frac: 0.5
  half_res: false
  netdepth: 8
  netwidth: 256
  netdepth_fine: 8
  netwidth_fine: 256
  lrate: 0.0005
  chunk: 32768
  netchunk: 65536
  perturb: 1.0
  i_embed: 0
  multires: 10
  multires_views: 4
  raw_noise_std: 0.0
  no_ndc: false
  lindisp: false
  near: 2.0
  far: 6.0
loss:
  semantic_weight: 0.004
  dino_weight: 0.04
train:
  max_steps: 2399999
  seed: 0
  device: cuda
  i_print: 100
  save_every: 10000
  eval_every: 10000
  eval_scenes: 4
  render_chunk: 4096
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/split_seed0.json
  lookat: null
  pose_scale: null
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/gate_report.json
  consumer: snerl
  source: realworld
  target: pick-and-place
dino:
  weights: null
  pretrained: true
