# Retained baseline: same drawer-open-v2 architecture, loss and schedule; no inherited scene measurements.
# Template: resolve ${pnpv2.*} only through the pick-and-place-v2 task spec.
dataset:
  hdf5_path: ${pnpv2.geometry_store}
  num_inputs: 3
  num_workers: 4
  prefetch_factor: 4
nerf:
  dataset_type: blender
  no_batching: true
  use_viewdirs: true
  white_bkgd: false
  lrate_decay: 500
  N_samples: 64
  N_importance: 128
  N_rand: 1024
  precrop_iters: 500
  precrop_frac: 0.5
  half_res: false
  netdepth: 8
  netwidth: 256
  netdepth_fine: 8
  netwidth_fine: 256
  lrate: 0.0005
  chunk: 32768
  netchunk: 65536
  perturb: 1.0
  i_embed: 0
  multires: 10
  multires_views: 4
  raw_noise_std: 0.0
  no_ndc: false
  lindisp: false
  near: 2.0
  far: 6.0
loss:
  semantic_weight: 0.004
  dino_weight: 0.04
train:
  max_steps: 2399999
  seed: 0
  device: cuda
  i_print: 100
  save_every: 10000
  eval_every: 10000
  eval_scenes: 4
  render_chunk: 4096
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: ${pnpv2.split}
  lookat: ${pnpv2.lookat}
  pose_scale: ${pnpv2.pose_scale}
  gate_report: ${pnpv2.geometry_gate}
  consumer: snerl
  source: realworld
  target: pick-and-place-v2
dino:
  weights: null
  pretrained: true
