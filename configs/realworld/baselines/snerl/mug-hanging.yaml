# snerl pretraining on the REAL-WORLD mug-hanging store (generated by s4d/rwlearn/configs.py; do not
# edit by hand). Base: configs/baselines/snerl/drawer-open.yaml (accepted Meta-World protocol);
# every other key is the documented protocol value. Overrides and reasons:
#   dataset.hdf5_path = /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/store.yaml: for source realworld this key holds the FrameStore descriptor (s4d/rwlearn/store.py; compact per-camera training store, centre crop 128 px), not an HDF5 file; the trainers pass it through unchanged
#   data_interface.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/split_seed0.json: seeded per-task 90/10 episode split (s4d/rwlearn/store.py::split_episodes; union of both tasks for joint)
#   data_interface.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/gate_report.json: full-data gate evidence (s4d/rwlearn/gate.py); runs > 10k steps refuse without a passed report whose episode sets equal the store's
#   data_interface.source = realworld: selects the real-world dataset classes (per-episode cameras, loader-side sync, run-bounded windows)
#   data_interface.target = mug-hanging: task(s) in the store
#   data_interface.lookat = [0.334, -0.031, 0.353]: normalised scene origin: least-squares intersection of the three optical axes (Meta-World: rig look-at)
#   data_interface.pose_scale = 3.79: cameras 4 official units from the origin, as official / Meta-World (median distance 1.055 m); official near/far 2/6 -> 0.53-1.58 m camera depth, which holds the workspace (68.5 % of all valid depth of the centre-cropped views; the rest is distant room background)
#   dataset.num_inputs = 3: official encoder input count; the rig has exactly 3 cameras, so every target view is also an input view (Meta-World: 3 of 6)
# Plan rows only through scripts/realworld_learning.py plan (full-data gate); see docs/realworld_baselines.md.
dataset:
  hdf5_path: /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/store.yaml
  num_inputs: 3
  num_workers: 4
  prefetch_factor: 4
nerf:
  dataset_type: blender
  no_batching: true
  use_viewdirs: true
  white_bkgd: false
  lrate_decay: 500
  N_samples: 64
  N_importance: 128
  N_rand: 1024
  precrop_iters: 500
  precrop_frac: 0.5
  half_res: false
  netdepth: 8
  netwidth: 256
  netdepth_fine: 8
  netwidth_fine: 256
  lrate: 0.0005
  chunk: 32768
  netchunk: 65536
  perturb: 1.0
  i_embed: 0
  multires: 10
  multires_views: 4
  raw_noise_std: 0.0
  no_ndc: false
  lindisp: false
  near: 2.0
  far: 6.0
loss:
  semantic_weight: 0.004
  dino_weight: 0.04
train:
  max_steps: 2399999
  seed: 0
  device: cuda
  i_print: 100
  save_every: 10000
  eval_every: 10000
  eval_scenes: 4
  render_chunk: 4096
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/split_seed0.json
  lookat:
  - 0.334
  - -0.031
  - 0.353
  pose_scale: 3.79
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/mug-hanging/gate_report.json
  source: realworld
  target: mug-hanging
dino:
  weights: null
  pretrained: true
