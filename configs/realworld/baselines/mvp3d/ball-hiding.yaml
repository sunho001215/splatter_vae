# Retained baseline: same drawer-open-v2 architecture, loss and schedule; no inherited scene measurements.
# Template: resolve ${pnpv2.*} only through the ball-hiding task spec.
dataset:
  hdf5_path: ${pnpv2.geometry_store}
  num_views: 3
  max_episodes: null
  max_frames_per_demo: null
  num_workers: 8
  pin_memory: true
render:
  bounds: ${pnpv2.bounds}
  radius: 0.012
model:
  img_size: 48
  img_patch_size: 12
  im_channels: 64
  attn_dim: 256
  attn_heads: 8
  attn_dim_head: 32
  depth: 8
  attn_dropout: 0.1
  activation: lrelu
  num_img: 5
  decoder_depth: 2
  decoder_dim: 256
  decoder_heads: 8
  decoder_dim_head: 32
  mask_ratio: 0.75
  mask_fill: 0.0
train:
  batch_size: 3
  epochs: 15
  max_steps: null
  lr: 0.0001
  weight_decay: 0.01
  seed: 0
  device: cuda
  log_every: 100
  eval_every: 10000
  save_every: 10000
  val_samples: 30
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: ${pnpv2.geometry_split}
  gate_report: ${pnpv2.geometry_gate}
  consumer: mvp3d
  source: realworld
  target: ball-hiding
