# dynamo pretraining on the REAL-WORLD drawer-open store (generated by s4d/rwlearn/configs.py; do not
# edit by hand). Base: configs/baselines/dynamo/drawer-open.yaml (accepted Meta-World protocol);
# every other key is the documented protocol value. Overrides and reasons:
#   dataset.hdf5_path = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/store.yaml: for source realworld this key holds the FrameStore descriptor (s4d/rwlearn/store.py; compact per-camera training store, centre crop 128 px), not an HDF5 file; the trainers pass it through unchanged
#   data_interface.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/split_seed0.json: seeded per-task 90/10 episode split (s4d/rwlearn/store.py::split_episodes; union of both tasks for joint)
#   data_interface.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/gate_report.json: full-data gate evidence (s4d/rwlearn/gate.py); runs > 10k steps refuse without a passed report whose episode sets equal the store's
#   data_interface.source = realworld: selects the real-world dataset classes (per-episode cameras, loader-side sync, run-bounded windows)
#   data_interface.target = drawer-open: task(s) in the store
#   data_interface.frame_spacing = 1: one camera frame = one real-world policy step (upstream frame_step 1)
#   projector.output_dim = 14: chosen per the README rule 'approximately the underlying state dimension': 7 arm joints + gripper + 6-DoF manipulated object (Meta-World: its 39-d observation)
# Plan rows only through scripts/realworld_learning.py plan (full-data gate); see docs/realworld_baselines.md.
dataset:
  hdf5_path: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/store.yaml
  batch_size: 64
  num_workers: 15
  pin_memory: true
  window_size: 5
  max_episodes: null
encoder:
  pretrained: false
  output_dim: 512
  unit_norm: false
projector:
  n_layer: 6
  n_head: 6
  n_embd: 120
  output_dim: 14
  dropout: 0.0
ssl:
  n_layer: 6
  n_head: 6
  n_embd: 120
  dropout: 0.0
  covariance_reg_coef: 0.04
  dynamics_loss_coef: 1.0
  ema_beta: null
  beta_scheduling: true
  projector_use_ema: true
  separate_single_views: true
train:
  ssl_lr: 0.0001
  ssl_weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  clip_grad_norm: 0.1
  seed: 42
  sync_bn: true
  use_lr_scheduling: true
  warmup_epochs: 5
  num_epochs: 40
  save_every_epochs: 10
  device: cuda
  max_global_steps: null
  save_every: 2000
  log_every: 50
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/split_seed0.json
  frame_spacing: 1
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open/gate_report.json
  source: realworld
  target: drawer-open
