# Retained baseline: same drawer-open-v2 architecture, loss and schedule; no inherited scene measurements.
# Template: resolve ${pnpv2.*} only through the pick-and-place-v2 task spec.
dataset:
  hdf5_path: ${pnpv2.geometry_store}
  num_views: 3
  sequence_length: 3
  max_episodes: null
  max_frames_per_demo: 3000
  temporal_stride: 3
  num_workers: 8
  pin_memory: true
  batch_size: 8
  train_ratio: 0.96
model:
  img_size: 128
  netdepth: 8
  netwidth: 256
  netdepth_fine: 8
  netwidth_fine: 256
  N_rand: 2048
  N_samples: 64
  N_importance: 128
  multires: 10
  multires_views: 4
  i_embed: 0
  use_viewdirs: true
  raw_noise_std: 0.0
  white_bkgd: false
  perturb: 1.0
  lindisp: false
  patch_size: 16
  embed_dim: 256
  vit_depth: 4
  vit_num_heads: 4
  vit_mlp_dim: 1024
  decoder_depth: 2
  decoder_num_heads: 2
  decoder_mlp_dim: 1024
  decoder_output_dim: 256
  time_interval: 3
  mask_ratio: 0.75
  num_views: 6
  num_ref_views: 2
  near: 0.1
  far: 2.5
  chunk: 32768
  netchunk: 65536
  enc_contrastive_margin: 0.2
  precrop_iters: 2000
  precrop_frac: 0.5
train:
  num_epochs: 50
  max_global_steps: 300000
  lrate: 0.0005
  lrate_decay: 500
  device: cuda
  eval_every: 1000
  save_every: 30000
  i_print: 100
  i_img: 500
  seed: 42
  val_random_sample: true
  val_vis_nrow: 6
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: ${pnpv2.split}
  frame_spacing: 1
  gate_report: ${pnpv2.geometry_gate}
  consumer: sincro
  source: realworld
  target: pick-and-place-v2
  sincro_encoder_num_view: 6
