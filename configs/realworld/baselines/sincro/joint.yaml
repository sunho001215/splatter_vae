# sincro pretraining on the REAL-WORLD joint store (generated by s4d/rwlearn/configs.py; do not
# edit by hand). Base: configs/baselines/sincro/drawer-open.yaml (accepted Meta-World protocol);
# every other key is the documented protocol value. Overrides and reasons:
#   dataset.hdf5_path = /home/compu/kaist/sunho/realworld/learning_inputs/joint/store.yaml: for source realworld this key holds the FrameStore descriptor (s4d/rwlearn/store.py; compact per-camera training store, centre crop 128 px), not an HDF5 file; the trainers pass it through unchanged
#   data_interface.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/joint/split_seed0.json: seeded per-task 90/10 episode split (s4d/rwlearn/store.py::split_episodes; union of both tasks for joint)
#   data_interface.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/joint/gate_report.json: full-data gate evidence (s4d/rwlearn/gate.py); runs > 10k steps refuse without a passed report whose episode sets equal the store's
#   data_interface.source = realworld: selects the real-world dataset classes (per-episode cameras, loader-side sync, run-bounded windows)
#   data_interface.target = joint: task(s) in the store
#   dataset.num_views = 3: all three cameras (Meta-World: 6 training cameras)
#   data_interface.sincro_encoder_num_view = 6: the trainer builds the encoder with this num_view: upstream MaskedViTEncoder makes num_view // 3 + 1 decoder image tokens, which must equal 1 primary + 2 reference views = 3; 6 keeps the Meta-World encoder architecture exactly (with num_view 3 upstream asserts); the three views enter through the data
#   data_interface.frame_spacing = 1: one camera frame = one real-world policy step (Meta-World: 2 sim steps = one RL step)
# Plan rows only through scripts/realworld_learning.py plan (full-data gate); see docs/realworld_baselines.md.
dataset:
  hdf5_path: /home/compu/kaist/sunho/realworld/learning_inputs/joint/store.yaml
  num_views: 3
  sequence_length: 3
  max_episodes: null
  max_frames_per_demo: 3000
  temporal_stride: 3
  num_workers: 8
  pin_memory: true
  batch_size: 8
  train_ratio: 0.96
model:
  img_size: 128
  netdepth: 8
  netwidth: 256
  netdepth_fine: 8
  netwidth_fine: 256
  N_rand: 2048
  N_samples: 64
  N_importance: 128
  multires: 10
  multires_views: 4
  i_embed: 0
  use_viewdirs: true
  raw_noise_std: 0.0
  white_bkgd: false
  perturb: 1.0
  lindisp: false
  patch_size: 16
  embed_dim: 256
  vit_depth: 4
  vit_num_heads: 4
  vit_mlp_dim: 1024
  decoder_depth: 2
  decoder_num_heads: 2
  decoder_mlp_dim: 1024
  decoder_output_dim: 256
  time_interval: 3
  mask_ratio: 0.75
  num_views: 6
  num_ref_views: 2
  near: 0.1
  far: 2.5
  chunk: 32768
  netchunk: 65536
  enc_contrastive_margin: 0.2
  precrop_iters: 2000
  precrop_frac: 0.5
train:
  num_epochs: 50
  max_global_steps: 300000
  lrate: 0.0005
  lrate_decay: 500
  device: cuda
  eval_every: 1000
  save_every: 30000
  i_print: 100
  i_img: 500
  seed: 42
  val_random_sample: true
  val_vis_nrow: 6
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/joint/split_seed0.json
  frame_spacing: 1
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/joint/gate_report.json
  source: realworld
  target: joint
  sincro_encoder_num_view: 6
