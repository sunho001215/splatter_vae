# reviwo pretraining on the REAL-WORLD pick-and-place store (generated by s4d/rwlearn/configs.py; do not
# edit by hand). Base: configs/baselines/reviwo/drawer-open.yaml (accepted Meta-World protocol);
# every other key is the documented protocol value. Overrides and reasons:
#   dataset.hdf5_path = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/store.yaml: for source realworld this key holds the FrameStore descriptor (s4d/rwlearn/store.py; compact per-camera training store, centre crop 128 px), not an HDF5 file; the trainers pass it through unchanged
#   data_interface.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/split_seed0.json: seeded per-task 90/10 EPISODE-level split, fixed and recorded (s4d/rwlearn/store.py::split_episodes, seed 0); validation episodes are never trained on
#   data_interface.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/gate_report.json: full-data gate evidence (s4d/rwlearn/gate.py); runs > 10k steps refuse without a passed report whose episode sets equal the store's
#   data_interface.consumer = reviwo: non-geometric consumer (s4d/rwlearn/gate.py CONSUMERS): RGB / timestamps only, not held by calibration
#   data_interface.source = realworld: selects the real-world dataset classes (per-episode cameras, loader-side sync, run-bounded windows)
#   data_interface.target = pick-and-place: task(s) in the store
#   dataset.camera_num = 3: all three cameras
#   train.camera_num = 3: all three cameras
# Plan rows only through scripts/realworld_learning.py plan (full-data gate); see docs/realworld_baselines.md.
dataset:
  hdf5_path: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/store.yaml
  batch_size: 8
  num_workers: 8
  pin_memory: true
  train_ratio: 0.96
  seed: 42
  num_episodes: null
  max_frames_per_demo: null
  min_time_gap: 25
  camera_num: 3
reviwo:
  img_size: 128
  patch_size: 16
  fusion_style: plus
  use_latent_vq: true
  is_latent_ae: false
  use_view_vq: true
  is_view_ae: false
  view_encoder:
    block_size: 256
    vocab_size: 512
    n_tokens_per_frame: 256
    n_layer: 8
    n_head: 8
    n_embed: 128
    dropout: 0.1
    bias: false
    mask_rate: 0
  latent_encoder:
    block_size: 256
    vocab_size: 512
    n_tokens_per_frame: 256
    n_layer: 8
    n_head: 8
    n_embed: 128
    dropout: 0.1
    bias: false
    mask_rate: 0
  decoder:
    block_size: 256
    vocab_size: 512
    n_tokens_per_frame: 256
    n_layer: 8
    n_head: 8
    n_embed: 128
    dropout: 0.1
    bias: false
    mask_rate: 0
  view_codebook:
    embed_dim: 16
    n_embed: 64
    beta: 0.25
  latent_codebook:
    embed_dim: 16
    n_embed: 512
    beta: 0.25
train:
  num_epochs: 1000
  max_global_steps: 100001
  lr: 0.0003
  device: cuda:0
  loss_form: Weighted_MSE
  vq_coef: 0.25
  shuffled_v_coef: 2.0
  shuffled_l_coef: 2.0
  shuffled_vl_coef: 2.0
  latent_consistency_coef: 0.5
  view_consistency_coef: 0.1
  latent_contrastive_coef: 0.5
  view_contrastive_coef: 0.1
  temperature: 0.25
  lower_bound: 0.9
  eval_every: 1000
  save_every: 5000
  log_every: 50
  camera_num: 3
wandb:
  project: splatter4d-baselines
data_interface:
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/split_seed0.json
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/pick-and-place/gate_report.json
  consumer: reviwo
  source: realworld
  target: pick-and-place
