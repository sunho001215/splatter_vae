# Real-data validation of the maintained real-world pipeline (MapAnything; FoundationStereo removed 2026-11-05) on one
# raw DROID episode, ZED 2 stereo pairs. Inputs are read-only. The historical 2026-10-31 FoundationStereo outputs under
# /home/ws/ws/validation-20261031/item5 are left untouched; this config writes to a new versioned output root.
# Remote run (all compute in the inference container, RAM-only streaming; ops/inference_server/README.md):
#   .venv/bin/python -I ops/inference_server/run_episode.py --pipeline configs/realworld/droid_raw_validation.yaml \
#       --server configs/realworld/inference_server.yaml --episode AUTOLab+0d4edc83+2023-10-21-19h-07m-04s
output_root: /home/ws/ws/realworld-20261104/processed/droid-v1
# Only our method is pretrained on DROID (user 2026-11-05): no baseline auxiliary inputs (no SAM 3 masks, no SNeRL DINO
# features). The historical droid-v1/baseline-droid/final-droid sam3_masks and dino_snerl outputs stay as evidence.
baselines: []
adapter:
  name: droid_raw_svo
  config:
    episodes:
      AUTOLab+0d4edc83+2023-10-21-19h-07m-04s: /home/ws/ws/validation-20261031/data/droid_raw/AUTOLab+0d4edc83+2023-10-21-19h-07m-04s
    calibration_dir: /home/ws/ws/validation-20261031/downloads/zed_factory_calib
    cameras: [ext1, ext2]
    cache_dir: /home/ws/ws/validation-20261031/item5/cache/svo_frames
    decoder: {python: /home/ws/ws/validation-20261031/envs/media/bin/python, timeout_s: 1800}
    droid3d_extrinsics: /home/ws/ws/validation-20261031/downloads/droid_3d_extrinsics/extrinsics.jsonl
    droid3d_intrinsics: /home/ws/ws/validation-20261031/downloads/droid_3d_extrinsics/camera_intrinsics.jsonl
    robot:   # official FR3 (franka_description 7aeeddc) + Robotiq 2F-85 (ros2_robotiq_gripper a74d007), composed by
             # scripts/realworld_compose_robot_urdf.py --mount-config droid_robotiq_2f85_iso50_coupling: Robotiq ISO-50
             # coupling stack 0.011 m, yaw +pi/2: PROVISIONAL (Robotiq drawings, coupling identity inferred from the
             # DROID guide photos; not measured; s4d/realworld/mounts.py and the manifest name the missing measurement).
             # Runs before 2026-11-02 used robot_assets/fr3_robotiq_2f85_droid.urdf (xyz 0, coupling omitted).
      urdf_path: /home/ws/ws/validation-20261031/droid_mount/robot_assets/fr3_robotiq_2f85_droid_iso50.urdf
      gripper_model: robotiq_2f_85
      gripper_joint: robotiq_85_left_knuckle_joint
      base_frame: fr3_link0
      flange_frame: fr3_link8
      joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
workers:   # paths inside the inference container (configs/realworld/inference_server.yaml)
  mapanything:
    python: /opt/envs/mapanything/bin/python
    repo_dir: /opt/upstream/map-anything
    expected_commit: 3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9
    checkpoint: /ram/weights/map-anything-a1d87e90/model.safetensors
    params: {hf_dir: /ram/weights/map-anything-a1d87e90, hf_repo: facebook/map-anything,
             hf_revision: a1d87e9086706fb9974f3be5a3e3a0ca5401c5aa, model_hw: [294, 518], use_depth: true,
             use_pose: true, apply_mask: true, mask_edges: true, amp_dtype: bf16}   # 16:9 ZED frames -> 518 x 294
  alltracker:
    python: /opt/envs/alltracker/bin/python
    repo_dir: /opt/upstream/alltracker
    expected_commit: e7553135e7b361590dbccd10e2b274b024f41cd6
    checkpoint: /ram/weights/alltracker/alltracker.pth
    params: {window_len: 16, inference_iters: 4}
  s4d_kernels:
    python: /opt/envs/s4d/bin/python
stages:
  stereo_rectify: {chunk: 16}
  mapanything_rig_depth: {}
  mapanything_depth: {chunk: 4, input_depth_stage: null, include_right_eyes: true, grouping: per_rig}   # ext1/ext2 not synchronized with each other
  calibrate: {source: adapter_provided}
  track2d: {window: 16, step: 8, grid_stride: 16, tracker_hw: [360, 640]}
  lift3d: {vis_threshold: 0.5, conf_threshold: 0.5}
  export: {strides: [1, 2], validation_tail_frames: 0}
