# Example run configuration (python -m s4d.realworld.cli --config configs/realworld/pipeline_example.yaml ...).
# Paths are placeholders; the synthetic adapter runs without any external asset.
adapter: {name: synthetic, config: {asset_dir: /tmp/s4d_realworld_synthetic_assets, frames: 10}}
output_root: TODO_output_root
workers:
  mapanything:
    python: TODO/envs/mapanything/bin/python
    repo_dir: TODO/map-anything
    expected_commit: 3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9
    checkpoint: TODO/map-anything-a1d87e90/model.safetensors
    params: {hf_dir: TODO/map-anything-a1d87e90, hf_repo: facebook/map-anything,
             hf_revision: a1d87e9086706fb9974f3be5a3e3a0ca5401c5aa, model_hw: [392, 518], use_depth: true,
             use_pose: true, apply_mask: true, mask_edges: true, amp_dtype: bf16}
  alltracker: {python: TODO/envs/alltracker/bin/python, repo_dir: TODO/alltracker, checkpoint: TODO/alltracker.pth,
               expected_commit: e7553135e7b361590dbccd10e2b274b024f41cd6, params: {inference_iters: 4, window_len: 16}}
stages:
  stereo_rectify: {chunk: 16}
  mapanything_rig_depth: {}
  mapanything_depth: {chunk: 4, input_depth_stage: null, include_right_eyes: true}
  calibrate:
    landmark_source: TODO     # annotation file / marker detector / render-and-match worker (see docs)
    landmark_links: [panda_link2, panda_link3, panda_link4, panda_link5, panda_link7, panda_link8]
    every: 2
  track2d: {window: 16, step: 8, grid_stride: 8, tracker_hw: null}   # e.g. [384, 640] for 720x1280 IR (multiples of 8)
  lift3d: {vis_threshold: 0.5, conf_threshold: 0.5}
  export: {strides: [1, 2], allow_infrared_input: false, validation_tail_frames: 0, max_sync_ns: null}
optional:
  sam3_masks: {prompts: {"robot arm": robot, "robotic gripper": robot, "TODO object": object, "table": fixture}}
  dino_snerl: {resolution: [128, 128]}
