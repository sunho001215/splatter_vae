# Our method (Original Splatter4D, Arm4-recommended) pretraining on the REAL-WORLD drawer-open-v2 store
# (generated by s4d/rwlearn/ours.py; do not edit by hand). Base: the RESOLVED simulation Original
# (configs/metaworld/base.yaml + configs/metaworld/tasks/drawer-open.yaml + train.steps=200000 train.seed=0 aug.synth_views=2 aug.synth_render=true loss.depth_valid_far=true loss.motion_space=gaussian); every other key
# is the simulation value. Overrides and reasons (deviations: realworld-ops/ours/DEVIATIONS.md):
#   data.regime = realworld: real-world compact training store instead of the simulator HDF5 (s4d/rwlearn/ours.py build_realworld)
#   data.task = drawer-open-v2: the real-world target task (task-specific encoders, user decision 2026-11-06)
#   data.root = <deleted>: Meta-World data root; the store descriptor data.store replaces it
#   data.train_ratio = <deleted>: Meta-World 96/4 episode split; replaced by the canonical seeded per-task 90/10 EPISODE split shared by every real-world method (data.split_manifest, s4d/rwlearn/store.py::split_episodes, seed 0)
#   data.episodes = <deleted>: Meta-World overfit-gate episode list; not defined for the real-world store
#   data.store = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/store.yaml: FrameStore descriptor (kind compact: per-episode files with 128 px centre-crop RGB, FoundationStereo depth, TrackEverything moving tracks, robot state, M5 sync sets and the episode's accepted calibration); the plan row sets the calibration release's copy
#   data.split_manifest = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/split_seed0.json: the canonical split of every real-world method; validation episodes are never trained on
#   data.gate_report = /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/gate_report.json: full-data gate evidence; runs > 10k steps refuse without a passed report at the geometry level of consumer 'ours' (calibration hold released, store built from the validated calibration)
#   data.consumer = ours: GEOMETRY-DEPENDENT consumer 'ours' (s4d/rwlearn/gate.py CONSUMERS)
#   data.target = drawer-open-v2: task(s) in the store
#   data.strides = [1, 2, 3]: camera frames between window frames: one frame = one real-world policy step (66.7 ms), so 1/2/3 frames are the simulation's 1/2/3 RL steps (Meta-World [2, 4, 6] simulator steps at action repeat 2); the FQL observation history (3 consecutive policy steps) lies inside the pretraining distribution
#   data.val_strides = [1, 3]: the policy spacing and the largest pretraining stride (Meta-World [2, 6] = 1 and 3 RL steps)
#   data.max_set_motion_m = 0.005: M5 cross-camera set criterion (coordinator decision 2026-11-06), the loaders' default, recorded explicitly
#   data.max_tracks = None: every stored moving track of the window's query chunk (no subsampling)
#   model.anchor_stats = None: per-task real-world workspace statistics, computed by the plan's stats row with the Meta-World procedure (scripts/compute_workspace_stats.py --regime realworld over the TRAINING episodes) and set by the row; null refuses to start (s4d/train/loop.py anchor_statistics_path)
#   aug.synth_camera_rig = training_cameras: the two synthetic views are jittered around the sample's OWN calibrated cameras with the Meta-World offsets (augment.jitter_training_cameras); the default rig is the Meta-World camera rig in the Meta-World world frame and is refused outside Meta-World (augment.synth_camera_rig)
#   eval.orbit_center = None: diagnostic orbit video only: the rig's measured optical-axis intersection in the robot base frame (SCENE_PARAMETERS; null = not measured for this target, the orbit video is skipped)
#   eval.orbit_distance = None: diagnostic orbit video only: the measured median camera distance
#   wandb.project = splatter4d-realworld: real-world runs are logged apart from the Meta-World project
# Plan rows only through the registrar (full-data gate, stats row, calibration release).
data:
  regime: realworld
  task: drawer-open-v2
  strides:
  - 1
  - 2
  - 3
  val_strides:
  - 1
  - 3
  store: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/store.yaml
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/split_seed0.json
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/drawer-open-v2/gate_report.json
  consumer: ours
  target: drawer-open-v2
  max_set_motion_m: 0.005
  max_tracks: null
model:
  encoder:
    backbone: scratch
    image_height: 128
    image_width: 128
    patch_size: 16
    width: 128
    depth: 8
    heads: 8
    num_slots: 1
    slot_dim: 256
    num_frames: 3
    mask_ratio: 0.5
    motion_patch_threshold: 0.05
    drop_path: 0.1
  decoder:
    dim: 128
    depth: 2
    heads: 4
    motion_max: 0.25
    scene:
      parents: 768
      children: 8
      offset_scale: 0.15
      child_radius: 0.06
      scale_min: 0.001
      scale_max: 0.08
    dynamic:
      parents: 256
      children: 8
      offset_scale: 0.4
      child_radius: 0.04
      scale_min: 0.0005
      scale_max: 0.03
    single_group: false
  anchor_stats: null
  single_frame: false
render:
  near: 0.05
  far: 3.0
loss:
  rgb: 1.0
  ssim_weight: 0.2
  lambda_dyn: 1.0
  coverage: 0.1
  depth_l1: 1.0
  depth_grad: 0.5
  depth_hard: 0.5
  depth_align: none
  depth_align_warmup_steps: 0
  motion: 5.0
  motion_huber: 0.01
  invariance: 1.0
  consistency: 0.5
  temperature: 0.1
  visibility: 1.0
  ramp_steps: 20000
  teacher_scale_jitter: null
  depth_valid_far: true
  motion_space: gaussian
train:
  steps: 200000
  batch_size: 16
  lr: 0.0005
  min_lr: 1.0e-05
  weight_decay: 0.01
  warmup_steps: 10000
  grad_clip: 1.0
  bf16: true
  seed: 0
  num_workers: 6
  prefetch_factor: 2
  log_every: 50
  eval_every: 5000
  save_every: 10000
  eval_at_start: true
eval:
  max_batches: 8
  probe_every: 10000
  probe_batches: 24
  orbit_center: null
  orbit_distance: null
  orbit_elevation: -45.0
wandb:
  enabled: true
  project: splatter4d-realworld
aug:
  synth_views: 2
  synth_render: true
  synth_camera_rig: training_cameras
