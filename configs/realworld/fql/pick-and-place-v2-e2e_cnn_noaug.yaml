# Offline FQL, end-to-end CNN: alpha 10, normalize_q_loss=false (established E2E setting, as drawer-open-v2); seeds from plan.
# Template: resolve ${pnpv2.*} only through the pick-and-place-v2 task spec.
condition: e2e_cnn
agent:
  lr: 0.0003
  batch_size: 256
  actor_hidden_dims:
  - 512
  - 512
  - 512
  - 512
  value_hidden_dims:
  - 512
  - 512
  - 512
  - 512
  layer_norm: true
  actor_layer_norm: false
  discount: 0.99
  tau: 0.005
  q_agg: mean
  alpha: 10.0
  flow_steps: 10
  normalize_q_loss: false
encoder:
  proj_dim: 256
  feature_norm: none
pixel:
  encoder: impala_small
  p_aug: 0.0
train:
  offline_steps: 1000000
  log_interval: 5000
  eval_interval: 100000
  save_interval: 50000
  seed: 0
  device: cuda
  val_batches: 8
  deterministic: false
data:
  dataset: runs/pnpv2-20261117-fqldata-e2e_cnn_noaug-pick-and-place-v2-S/dataset.h5
  split_manifest: ${pnpv2.rgb_split}
  gate_report: ${pnpv2.rgb_gate}
  store: ${pnpv2.rgb_store}
  frames_device: null
  action_clip_eps: 1.0e-05
  smoke_without_calibration: false
wandb:
  project: splatter4d-realworld-fql
