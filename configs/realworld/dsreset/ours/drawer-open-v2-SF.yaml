# Original 200k recipe; paired manifests, train-only statistics. Generated from ours task config.
data:
  regime: realworld
  task: drawer-open-v2
  strides:
  - 1
  - 2
  - 3
  val_strides:
  - 1
  - 3
  store: /home/compu/kaist/sunho/realworld/learning_inputs/dsreset/drawer-open-v2/SF/store.yaml
  split_manifest: /home/compu/kaist/sunho/realworld/learning_inputs/dsreset/drawer-open-v2/SF/split_seed0.json
  gate_report: /home/compu/kaist/sunho/realworld/learning_inputs/dsreset/drawer-open-v2/SF/gate_report.json
  consumer: ours
  target: drawer-open-v2
  max_set_motion_m: 0.005
  max_tracks: null
model:
  encoder:
    backbone: scratch
    image_height: 128
    image_width: 128
    patch_size: 16
    width: 128
    depth: 8
    heads: 8
    num_slots: 1
    slot_dim: 256
    num_frames: 3
    mask_ratio: 0.5
    motion_patch_threshold: 0.05
    drop_path: 0.1
  decoder:
    dim: 128
    depth: 2
    heads: 4
    motion_max: 0.25
    scene:
      parents: 768
      children: 8
      offset_scale: 0.15
      child_radius: 0.06
      scale_min: 0.001
      scale_max: 0.08
    dynamic:
      parents: 256
      children: 8
      offset_scale: 0.4
      child_radius: 0.04
      scale_min: 0.0005
      scale_max: 0.03
    single_group: false
  anchor_stats: runs/rwv2-20261113-prep-ours-drawer-open-v2-SF/workspace_stats.json
  single_frame: false
render:
  near: 0.05
  far: 3.0
loss:
  rgb: 1.0
  ssim_weight: 0.2
  lambda_dyn: 1.0
  coverage: 0.1
  depth_l1: 1.0
  depth_grad: 0.5
  depth_hard: 0.5
  depth_align: none
  depth_align_warmup_steps: 0
  motion: 5.0
  motion_huber: 0.01
  invariance: 1.0
  consistency: 0.5
  temperature: 0.1
  visibility: 1.0
  ramp_steps: 20000
  teacher_scale_jitter: null
  depth_valid_far: true
  motion_space: gaussian
train:
  steps: 200000
  batch_size: 16
  lr: 0.0005
  min_lr: 1.0e-05
  weight_decay: 0.01
  warmup_steps: 10000
  grad_clip: 1.0
  bf16: true
  seed: 0
  num_workers: 6
  prefetch_factor: 2
  log_every: 50
  eval_every: 5000
  save_every: 10000
  eval_at_start: true
eval:
  max_batches: 8
  probe_every: 10000
  probe_batches: 24
  orbit_center: null
  orbit_distance: null
  orbit_elevation: -45.0
wandb:
  enabled: true
  project: splatter4d-realworld
aug:
  synth_views: 2
  synth_render: true
  synth_camera_rig: training_cameras
