# Layer over the exact saved 200k config (never over a regenerated baseline).
train:
  steps: 400000
  original_steps: 200000
  lr_schedule: cosine_restarts
  restarts:
    - {start: 200000, end: 300000, warmup: 2500, peak_lr: 0.00025}
    - {start: 300000, end: 400000, warmup: 2500, peak_lr: 0.00025}
