# STANDARD own-rig real-world configuration (2026-11-05): mug hanging, Franka Emika Panda + Robotiq 2F-85 on the DROID
# mount (no wrist camera) + 3x RealSense D435I recording RGB (JPEG), native depth (PNG z16) and the device's left/right
# infrared pair (PNG Y8, laser emitter on). Selected pipeline (docs/realworld_preprocessing.md sections 3 and 9):
#   RGB for appearance and tracking; FoundationStereo on each device IR pair -> metric depth on the left-IR grid,
#   registered into the RGB grid (foundation_stereo_depth, "B1"); native depth + SAM 3 robot masks as calibration
#   evidence only; robot-grounded calibration; single-view TrackEverything per camera with B1 depth, intrinsics and the
#   accepted pose (writes track2d + lift3d); the noise-aware track_motion filter; the compact training store
#   (train_data: frames once per camera at 128x128, moving tracks only; SNeRL DINO targets are computed online).
# Requires the IR pair (adapter include_ir): an episode without it fails; no other depth model or tracker is used.
#   .venv/bin/python -I ops/inference_server/run_episode.py --pipeline configs/realworld/mug_hanging.yaml \
#       --server configs/realworld/inference_server.yaml --episode mug-hanging-test-000001
# Historical comparison roots (processed/ep1/{base,B0,B1,E1,E2,E3,B1-TE}, processed/v2-panda*) are kept unchanged.
output_root: /home/ws/ws/realworld-20261104/processed/ep1-standard
baselines: [snerl, mvp3d, sincro, reviwo, dynamo]
adapter:
  name: panda_teleop_h5
  config:
    episodes: {mug-hanging-test-000001: /home/ws/data/real_world/test/episode_000001.h5}
    include_ir: true   # device left/right infrared pairs (stereo/left|right)
    robot:   # official Panda = franka_description 7aeeddc robots/fer (fer = Franka Emika Robot, formerly Panda; fer_*
             # frames renamed panda_*) + Robotiq 2F-85 (ros2_robotiq_gripper a74d007), composed by
             # scripts/realworld_compose_robot_urdf.py --mount-config droid_robotiq_2f85_iso50_coupling --coupling-geometry:
             # DROID mount = Robotiq ISO-50 coupling, gripper frame +0.011 m along the flange z, yaw +pi/2 (NOMINAL vendor
             # drawing stack, provisional, not measured on this rig) and the coupling's own mesh. No wrist camera/bracket
             # (absent on this robot; it never was part of the flange->gripper stack). URDF FK = recorded flange poses and
             # all 7 recorded joint frames (max 2e-15 m).
      urdf_path: /home/ws/ws/validation-20261031/panda_assets/panda_robotiq_2f85_droid_iso50.urdf
      gripper_model: robotiq_2f_85
      gripper_joint: robotiq_85_left_knuckle_joint
      base_frame: panda_link0
      flange_frame: panda_link8
      joint_names: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
      arm_note: >-
        Franka Emika Panda (user-confirmed 2026-11-05; the file records only panda_link0/panda_link8 frames); Panda
        meshes and joint limits; same kinematic chain as FR3; DROID Robotiq mount without wrist camera; mount offset
        nominal (Robotiq drawings), not measured
workers:   # paths inside the inference container
  foundation_stereo:
    python: /opt/envs/foundation_stereo/bin/python
    repo_dir: /opt/upstream/FoundationStereo
    expected_commit: 6e8806816b533e4d13ddbb95ffa907b797060a62
    checkpoint: /ram/weights/foundation_stereo/23-51-11/model_best_bp2.pth
  trackeverything:   # single-view only; our depth/K/pose supplied, no geometry estimation
    python: /opt/envs/trackeverything/bin/python
    repo_dir: /opt/upstream/trackeverything
    expected_commit: dfb29b505cf2ea954f8697fb612c2429668dd3a0
    checkpoint: /ram/weights/trackeverything/model.pth
  sam3:
    python: /opt/envs/sam3/bin/python
    repo_dir: /opt/upstream/sam3
    expected_commit: f1647e8d0c1d280991f4d1b7d974c2704537fe66
    checkpoint: /ram/weights/sam3/sam3.pt
  dino_snerl:
    python: /opt/envs/s4d/bin/python
    expected_commit: 7c446df5b9f45747937fb0d72314eb9f7b66930a
  s4d_kernels:   # expected_commit is set to the local HEAD at run time (server code == reviewed code)
    python: /opt/envs/s4d/bin/python
stages:
  sensor_depth: {chunk: 32, min_depth_m: 0.1, max_depth_m: 6.0, splat: 2}   # calibration evidence only
  # B1: FoundationStereo on each device IR pair (native 640x480, valid_iters 32), registered to the colour grid with the
  # native-depth registration (splat 2); the depth every later stage lifts/exports with
  foundation_stereo_depth: {chunk: 8, valid_iters: 32, hiera: 0, min_disparity: 0.5, min_depth_m: 0.1,
                            max_depth_m: 6.0, splat: 2}
  calibrate:   # robot-grounded, RGB-D evidence: registered sensor depth + SAM 3 "robot arm" masks + URDF at recorded joints
    evidence: rgbd
    depth_stage: sensor_depth
    robot_mask_stage: sam3_masks
    every: 2
    max_frames: 200   # bounded calibration request (103 frames used here)
    landmark_links: []
    overlays: 4
    cfg:   # this episode's arm moves little (flange path extents ~19 x 8 x 6 cm): the whole masked robot surface carries
           # the constraint, so the flange-path coverage gate is lowered from 8 to 5 cm; covariance gates unchanged.
           # 13-start refinement (init + +-3 deg about / +-3 cm along the camera axes), best median depth residual on FIT
           # frames: with the Panda meshes camera 135122076054 stalled at 13 mm from the single start (2026-11-05).
      min_motion_extent_m: 0.05
      refine_starts: 13
  # single-view TrackEverything on every RGB camera independently: the camera's RGB clip, B1 depth on the colour grid,
  # its intrinsics and the accepted pose; same query windows/grid as the former track2d (window 16, step 8, stride 16)
  track_everything: {depth_stage: foundation_stereo_depth, window: 16, step: 8, grid_stride: 16, model_hw: [384, 512],
                     num_iters: 3}
  # dynamic-track filter (s4d/realworld/track_motion.py; intentional preprocessing change 2026-11-05): thresholds are
  # quantiles of the observed statistics of tracks >= 15 cm from the calibrated robot (image motion px; depth extent per
  # depth bin), with metric floors and temporal support; the training store keeps moving tracks only
  track_motion: {min_segment_samples: 5, max_depth_hole_frames: 2, max_gap_factor: 1.5, max_speed_m_s: 1.5,
                 reference_robot_distance_m: 0.15, reference_quantile_move: 0.995, reference_quantile_static: 0.9,
                 min_move_px: 1.5, min_move_m: 0.005, min_support: 2}
  # compact training store (s4d/realworld/train_store.py, data-format policy 2026-11-06): per camera 128x128 RGB/depth/
  # semantics of the centred square, calibration, timestamps, robot state, moving 3D tracks and cross-camera sets; the
  # loaders assemble windows/viewpoints (strides, gap factor, validation tail are loader settings). Cameras are not
  # hardware-synchronised (one runs a constant 22.9 ms behind) and one camera lacks the last frame: mutual nearest
  # frames within 30 ms (< half the 66.7 ms period; the default third of a period, 22.2 ms, is below camera
  # 135122076054's offset and would leave no three-camera set); unmatched frames run single-view. The same tolerance is
  # the frame-set policy of viewers/contract checks (depth_stages.configured_sets_policy).
  train_data: {task: mug-hanging, depth_stage: foundation_stereo_depth, max_sync_ns: 30000000, gripper_points: 32}
  sam3_masks:
    # "robotic gripper" (and gripper/black gripper/parallel gripper/two-finger gripper/gripper fingers) found nothing on
    # this black Robotiq 2F-85 (probe 2026-11-05, realworld-20261104/probes/sam3-gripper-20261105); "end effector"
    # segments the distal wrist + gripper assembly. Gripper coverage is measured against the calibrated URDF projection.
    # Robot masks are calibration evidence; the full semantics feed the SNeRL baseline.
    prompts: {robot arm: robot, end effector: robot, white mug: object, wooden mug tree: fixture}
    mode: segment_video
    chunk: 206
    score_threshold: 0.5
