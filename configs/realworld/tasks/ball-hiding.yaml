# ball-hiding (S only): the single source of conventional dataset locations and fixed science settings.
# Nothing here registers or launches work. scripts/pnpv2.py reads it (status / check-data / register).
# Per-arrival decisions that need the actual recordings (SAM3 prompts, robot URDF confirmation) are NOT repo edits:
# they go into <work>/arrival.json (schema ball-hiding-arrival/1), so no new release is needed at arrival.
# Templates: resolve ${pnpv2.*} only through s4d/rwlearn/pnpv2_spec.py.
schema: pick-and-place-v2-task/2
task: ball-hiding
variants:
- S
seeds:
- 0
- 1
- 2
collection:
  expected_success: 100
  validation_fraction: 0.1
  split_seed: 0
  failures_enabled: false
# Arrival = the operator's verified pull of Robot-PC teleop_collector/data/ball-hiding/success into
# <raw>/ball-hiding/success (dsreset 2026-11-13 transfer layout, as drawer-open-v2). This tooling never reads or
# writes the Robot PC. Complete = the marker with matching local/robotpc SHA lists, or a stable inventory.
arrival:
  completion_marker: success.VERIFIED
  local_sha256: success.local.sha256
  robotpc_sha256: success.robotpc.sha256
  stable_seconds: 600
calibration:
  criteria: rig_loma-release/2
  acceptance_override: null
roots:
  raw: /home/ws/data/real_world
  remote_raw: /home/compu/kaist/sunho/data/real_world
  processed: /home/ws/data/realworld-processed/bh-20261120
  remote_processed: /home/compu/kaist/sunho/realworld/processed/bh-20261120
  publication: /home/compu/kaist/sunho/realworld/learning_inputs/bh-20261120
  work: /home/ws/ws/realworld-ops/ballhiding-20261120
  robot_assets: /home/ws/ws/validation-20261031/panda_assets
# Lab Panda + Robotiq 2F-85 asset used by drawer-open-v2; arrival.json must confirm it (sha256) for the new recordings.
robot_urdf: panda_robotiq_2f85_droid_iso50.urdf
# Measured at registration from <processed>/measurements/ball-hiding/scene.json (train split only, native depth).
scene:
  lookat: null
  pose_scale: null
  bounds: null
# Confirmed per arrival in <work>/arrival.json after looking at the recordings; never inherited.
sam3_prompts: null
status: "PREPARED: independent normalized RGB and automatic geometry branches"
