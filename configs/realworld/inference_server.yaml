# Real-world inference server (RTX 5090, ssh alias irsl; 2026-11-04 directive, roles 2026-11-06). Host-specific; read by
# ops/inference_server. ROLE: lightweight inference, rendering and visualization only - single-episode runs (e.g. a
# validation episode, a viewer source); bulk real-world preprocessing runs on the remote host, no training here.
# Authentication: the operator opens the SSH ControlMaster "irsl" interactively (password typed once, never stored);
# every call below reuses it with BatchMode=yes, so a missing master fails fast instead of prompting.
ssh: [ssh, -o, BatchMode=yes, irsl]
git_remote: irsl:shkim/src/splatter4d.git
host_root: /home/irsl/shkim            # every project-controlled file on the host lives here
host_source: /home/irsl/shkim/src/splatter4d
container: shkim_rw                    # ONE persistent container (read-only rootfs, RAM tmpfs /ram, one GPU)
gpu_uuid: GPU-9bcf38b6-8240-e910-6548-ca715643dc11   # the designated RTX 5090 (GPU 2 at setup time)
workdir: /ram/work
source_root: /opt/src/splatter4d
python_for_tools: /opt/envs/s4d/bin/python
retries: 3
backoff_s: [5, 30, 120]
call_timeout_s: 3600
hello_timeout_s: 600
env:   # uid 1001 has no passwd entry in the image (USER/LOGNAME); git (s4d.third_party pins) from the tools env, read-only
  TMPDIR: /ram/tmp
  HF_HUB_OFFLINE: "1"
  S4D_CACHE_ROOT: /ram/s4d-cache
  USER: shkim
  LOGNAME: shkim
  GIT_OPTIONAL_LOCKS: "0"
  PATH: /opt/envs/tools/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
workers:
  sam3:
    python: /opt/envs/sam3/bin/python
    repo_dir: /opt/upstream/sam3
    checkpoint: /ram/weights/sam3/sam3.pt
    env: {CC: /opt/envs/sam3/bin/cc-zig}  # Triton JIT (sam3 NMS) needs a C compiler
  foundation_stereo:   # own-rig depth (device IR pair, B1)
    python: /opt/envs/foundation_stereo/bin/python
    repo_dir: /opt/upstream/FoundationStereo
    checkpoint: /ram/weights/foundation_stereo/23-51-11/model_best_bp2.pth
  trackeverything:   # own-rig tracker (single-view TrackEverything); the repo dir must be named trackeverything
    python: /opt/envs/trackeverything/bin/python
    repo_dir: /opt/upstream/trackeverything
    checkpoint: /ram/weights/trackeverything/model.pth
  dino_snerl: {python: /opt/envs/s4d/bin/python}
  s4d_kernels: {python: /opt/envs/s4d/bin/python}
weights:   # RAM only (container tmpfs); sha256 pinned; re-staged after a container restart. A run stages only the
           # weights of the workers its requested stages use (cli.STAGE_WORKERS); entries without ``worker``: always
  - {worker: sam3, dest: /ram/weights/sam3/sam3.pt, local: /home/ws/ws/validation-20261031/downloads/sam3/sam3.pt, sha256: 9999e2341ceef5e136daa386eecb55cb414446a00ac2b55eb2dfd2f7c3cf8c9e}
  - {worker: foundation_stereo, dest: /ram/weights/foundation_stereo/23-51-11/cfg.yaml,
     local: /home/ws/ws/validation-20261031/downloads/foundation_stereo/23-51-11/cfg.yaml,
     sha256: a9d9dd2137c30edc2236194f62df14d222dad5fd3287a33c7540b543bb93853f}
  - {worker: foundation_stereo, dest: /ram/weights/foundation_stereo/23-51-11/model_best_bp2.pth,
     local: /home/ws/ws/validation-20261031/downloads/foundation_stereo/23-51-11/model_best_bp2.pth,
     sha256: 60e79bde9c6a00acea551625ff814fe06e5a6806e2c0c9829baee248de87c5f1}
  - {worker: trackeverything, dest: /ram/weights/trackeverything/model.pth,
     local: /home/ws/ws/validation-20261031/downloads/trackeverything/model.pth,
     sha256: 4553975d372096f8c3d7c5fc35fd7025ef8a7611355e6ada8eb251ef1f5feac1}
  - {worker: dino_snerl, dest: /ram/s4d-cache/torch/hub/checkpoints/dino_deitsmall8_pretrain.pth,
     local: /home/ws/ws/splatter4d/.cache/torch/hub/checkpoints/dino_deitsmall8_pretrain.pth, sha256: 55c8b267f479b614ec20858947ce361ba804846c193e20be74263a096bb6d75e}
