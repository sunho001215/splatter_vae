# VERSION far4 of configs/droid/vits_largescale.yaml (user directive 2026-11-05): render.far 4.0 instead
# of 3.0 for DROID pretraining. render.far is the ONLY difference (tests/test_droid_far4_profiles.py fails on any other
# key); configs/droid/vits_largescale.yaml keeps far 3.0 unchanged, so every run that resolved it keeps its meaning.
# Meta-World configs are untouched.
# Everything range-dependent follows render.far; there is no separate key. With loss.depth_valid_far: the depth L1 /
# coverage / depth-metric masks (0 < d < far), the Chamfer target points (0 < d < far) and the track motion weights
# (camera z < far). Also the synthetic views' fused GT cloud (0 < d <= far) and look-at depth (near < d < far), and the
# renderer's far plane (Gaussian centres beyond it are culled) in the training, synthetic-view and evaluation renders.
# Source validity stays separate: released depth 0 and 65535 mm are invalid (depth_mm_to_m); PointWorld tracks are
# depth-valid for 0 < d <= 4.0 m upstream (scene_depth_valid_mask). Measurement on the released inputs and the full
# consumer map: docs/droid_largescale_validation/far4_effective_config.md.
#
# DROID ViT-S-sized profile (user decision 2026-11-02): a ViT-S-sized backbone (width 384, depth 12, 6 heads, MLP ratio 4)
# with our patch-local convolutional stem (stem: patch_cnn), on 224x224 square crops of the native 180x320 DROID frames.
# This is NOT the csw4 encoder (256/4/4, configs/droid/csw4_largescale.yaml, kept unchanged) and not a DINOv2/ViT-S
# patchify backbone: only the transformer body has ViT-S dimensions. Self-contained: use it ALONE,
#   python scripts/train.py --config configs/droid/vits_largescale_far4.yaml \
#       --set data.manifest=... data.pointworld_root=... data.rlds_index_dir=... data.rlds_data_root=... \
#             model.anchor_stats=... --name droid_largescale-vitsfar4-<tag>-<seed>
#
# Every key equals configs/droid/csw4_largescale_far4.yaml except the INTENDED differences registered (each with its
# justification) in tests/test_droid_vits_profile.py: the encoder input size and transformer dimensions, and data.crop.
# Temporal processing (3 frames, temporal embeddings, one state token), slot_dim 256 (slot_proj = Linear(384, 256), so
# the decoder, its Gaussian budget and every downstream state dimension are unchanged), mask_mode random at 0.75 and
# every loss weight are the csw4 values. Preprocessing, crop, masking and the inference contract: docs/droid_largescale.md
# §7; effective configuration: docs/droid_largescale_validation/vits_effective_config.md.

data:
  regime: droid_largescale  # dataset: lazy RLDS x PointWorld x DROID-3D windows (s4d/data/droid/largescale)
  root: null                # dataset: unused by this regime (sources are the four paths below)
  manifest: null            # dataset: scripts/droid_ls_build_manifest.py output; null fails fast until given
  pointworld_root: null     # dataset: extracted PointWorld-DROID tree; null fails fast until given
  rlds_index_dir: null      # dataset: scripts/droid_ls_build_rlds_index.py output; null fails fast until given
  rlds_data_root: null      # dataset: released DROID RLDS shards, read in place (read-only); null fails fast until given
  validation_percent: 2.0   # dataset: episode-disjoint hash split (no Meta-World train_ratio/episode list exists here)
  stride: 3                 # timing: 3 canonical PointWorld steps = 6 raw steps at 15 Hz = 0.4 s between window frames
  max_tracks: 4096          # dataset: per-camera track budget of the batch contract (deterministic subsample / padding)
  with_wrist: true          # dataset: supervision-only wrist_* fields when the wrist QA accepts an episode (unused by the loss)
  gripper_offset_m: -0.019  # geometry: approach-axis gripper point offset (m), fitted on the inspected DROID sample
  max_open_files: 8         # loader: per worker and file kind; bounded handles measured flat at 29 fds (item 8 §3.6)
  crop:                     # image: motion-informed stochastic square crop -> 224x224 (s4d/data/droid/largescale/crop.py)
    out_size: 224           # = model.encoder.image_height = image_width (14 x 14 patches of 16)
    side_min: 180           # crop side s in [180, 320] native pixels: from the full height to the full width
    side_max: 320
    motion_min_m: 0.02      # a reliable track moves if its largest visible-to-visible world displacement exceeds 2 cm
    motion_max_m: 0.4       # larger jumps are track / depth-edge failures, not motion
    min_moving_tracks: 32   # fewer reliable or moving tracks -> broad fallback
    extent_quantiles: [0.05, 0.95]  # robust motion-weighted extent of the moving tracks over the history frames
    margin_frac: 0.2        # context around the moving extent: max(24 px, 0.2 x extent) on every side
    margin_min_px: 24
    zoom_span_px: 80        # s uniform in [s_lo, s_lo + 80] (clipped to 320); s_lo = max(180, clipped required extent)
    broad_side_min: 256     # broad fallback (weak / unreliable / dispersed motion): s uniform in [256, 320]
    jitter_frac: 0.1        # vertical padding split: centre +- 0.1 s (never loses observed rows)
    eval_policy: center     # validation windows: the padding-free central 180x180 square (= the inference contract)

model:
  encoder:
    backbone: scratch
    image_height: 224       # image: square crops of the native 180x320 grid resized to 224 (K transformed exactly)
    image_width: 224        # 14 x 14 = 196 tokens per frame, 588 per 3-frame window; 75 % masked: 441, 147 kept
    patch_size: 16
    width: 384              # ViT-S-sized transformer body (384 / 12 / 6, MLP ratio 4) on our patch-local CNN stem
    depth: 12
    heads: 6
    mlp_ratio: 4.0
    num_slots: 1
    slot_dim: 256           # kept: slot_proj Linear(384, 256); decoder and downstream state dims unchanged
    num_frames: 3
    mask_ratio: 0.75
    motion_patch_threshold: 0.05
    drop_path: 0.1
    mask_mode: random
    stem: patch_cnn
  decoder:
    dim: 128
    depth: 2
    heads: 4
    motion_max: 0.25
    scene:
      parents: 768
      children: 8
      offset_scale: 0.15
      child_radius: 0.06
      scale_min: 0.001
      scale_max: 0.08
    dynamic:
      parents: 256
      children: 8
      offset_scale: 0.4
      child_radius: 0.04
      scale_min: 0.0005
      scale_max: 0.03
    single_group: false
  anchor_stats: null        # geometry: DROID workspace statistics (scripts/compute_workspace_stats.py --regime droid_largescale); set before any run
  single_frame: false

render:
  near: 0.05                # geometry: same near plane; DROID wrist depth starts at 0.068 m (1st pct), ext at 0.19 m
  far: 4.0                  # geometry, VERSION far4 (user 2026-11-05): PointWorld's track depth cap (MAX_DEPTH_M 4.0);
                            # training-window ext depth: 0.68 % of valid in (3, 4] m, 0.43 % beyond 4 m (294 AUTOLab)

loss:
  rgb: 1.0
  ssim_weight: 0.2
  lambda_dyn: 1.0
  coverage: 0.1
  depth_l1: 1.0
  depth_grad: 0.0
  depth_hard: 0.0
  depth_align: none
  depth_align_warmup_steps: 0
  motion: 5.0
  motion_huber: 0.01
  invariance: 1.0
  consistency: 0.5
  temperature: 0.1
  visibility: 0.0
  ramp_steps: 20000
  teacher_scale_jitter: null
  depth_valid_far: true
  motion_space: gaussian
  occlusion: 0.0
  chamfer: 5.0
  chamfer_points: 4096
  chamfer_voxel_m: 0.01
  motion_feature_render: log_steps

aug:
  synth_views: 2
  synth_render: true
  synth_camera_rig: training_cameras  # geometry: jitter around the episode's own cameras; the default rig is Meta-World's world frame

train:
  steps: 300000             # run scale: fixed at launch (--set train.steps); csw4 pretraining used 200000
  batch_size: 16
  lr: 5.0e-4
  min_lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 10000
  grad_clip: 1.0
  bf16: true
  seed: 0
  num_workers: 8            # loader: 98.7 windows/s with 8 workers vs 48.5 with 4 (item 8 §3.6; depth gzip decode bound)
  prefetch_factor: 2
  log_every: 50
  eval_every: 5000
  save_every: 10000
  eval_at_start: true

eval:
  max_batches: 8
  probe_every: 10000
  probe_batches: 24
  orbit_center: [0.6, 0.0, 0.15]  # geometry: DROID robot-base frame; dynamic anchor mean (0.63, -0.01, 0.15) m on the sample
  orbit_distance: 1.0
  orbit_elevation: -45.0

wandb:
  enabled: true
  project: splatter4d-droid  # bookkeeping: the DROID project
