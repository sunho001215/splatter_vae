data:
  regime: droid
  root: /home/ws/data/droid_pointworld_cache_sample
model:
  encoder:
    backbone: scratch
    image_height: 144
    image_width: 256
    patch_size: 16
    width: 384
    depth: 12
    heads: 6
    num_slots: 16
    slot_dim: 384
    num_frames: 3
    mask_ratio: 0.6
    motion_patch_threshold: 0.05
    drop_path: 0.1
  decoder:
    dim: 256
    depth: 2
    heads: 8
    motion_max: 0.25
    scene: {parents: 1536, children: 8, offset_scale: 0.25, child_radius: 0.06, scale_min: 0.001, scale_max: 0.08}
    dynamic: {parents: 512, children: 8, offset_scale: 0.40, child_radius: 0.04, scale_min: 0.0005, scale_max: 0.03}
    single_group: false
  anchor_stats: /home/ws/data/droid_pointworld_cache_sample/workspace_stats.json
  single_frame: false
render: {near: 0.05, far: 4.0}
loss:
  rgb: 1.0
  ssim_weight: 0.2
  lambda_dyn: 1.0
  coverage: 0.1
  depth_l1: 1.0
  depth_grad: 0.5
  depth_hard: 0.5
  depth_align: scale
  depth_align_warmup_steps: 5000
  motion: 5.0
  motion_huber: 0.01
  invariance: 1.0
  consistency: 0.1
  temperature: 0.1
  visibility: 1.0
  ramp_steps: 20000
  teacher_scale_jitter: null
train:
  steps: 300
  batch_size: 2
  lr: 5.0e-4
  min_lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  bf16: true
  seed: 0
  num_workers: 0
  log_every: 50
  eval_every: 300
  save_every: 300
  eval_at_start: true
eval:
  max_batches: 8
  probe_every: 10000
  orbit_center: [0.4, 0.0, 0.15]
  orbit_distance: 1.0
  orbit_elevation: -45.0
wandb: {enabled: true, project: splatter4d-droid}
