# Layer after pretrain.yaml and optionally dinov2.yaml. These are training-split indices.
# Repeat exactly one batch. Do not rescale the 20k temporal ramp or 5k alignment warmup.
data:
  fixed_window_indices: [0, 1]
train:
  steps: 2000
  batch_size: 2
  eval_every: 500
  save_every: 2000
  eval_at_start: true
  num_workers: 0
eval:
  max_batches: 1
  probe_every: 0
