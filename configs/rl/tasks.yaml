# Per-task settings, identical for every method. DrM hyperparameters come from configs/rl/base.yaml.
# The official DrM code sets per-task overrides only for Meta-World sweep-into (max_perturb_factor 0.9,
# target_lambda 0.6); none of the eight campaign tasks has an official per-task setting, so `drm_overrides`
# is empty for all of them. Difficulty (reporting only): Seo et al., MWM (CoRL 2022), Appendix F.
door-open:       {difficulty: easy,      drm_overrides: {}}
peg-unplug-side: {difficulty: easy,      drm_overrides: {}}
hammer:          {difficulty: medium,    drm_overrides: {}}
peg-insert-side: {difficulty: medium,    drm_overrides: {}}
bin-picking:     {difficulty: medium,    drm_overrides: {}}
pick-place:      {difficulty: hard,      drm_overrides: {}}
stick-push:      {difficulty: very hard, drm_overrides: {}}
shelf-place:     {difficulty: very hard, drm_overrides: {}}
