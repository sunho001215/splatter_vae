# Per-task DrQ-v2 exploration schedule, used identically by every method (ours, CNN, SinCro, ReViWo, ablations).
# Unit: agent steps, the reference training-loop counter (agents/drqv2/train_drqv2_metaworld.py: one
# `for step` iteration = one env.step = action_repeat 2 simulator steps, passed to schedule(stddev_schedule, step)).
# Difficulty: Seo et al., "Masked World Models for Visual Control" (CoRL 2022, arXiv:2206.14244), Appendix F,
# verified from the paper text on 2026-10-07.
# Deviation from the reference, decided by the user: the reference uses linear(1.0,0.1,150000) for every task.
schedules:
  easy: linear(1.0,0.1,100000)
  medium: linear(1.0,0.1,250000)
  hard: linear(1.0,0.1,500000)
  very hard: linear(1.0,0.1,500000)
tasks:
  door-open: easy
  peg-unplug-side: easy
  hammer: medium
  peg-insert-side: medium
  bin-picking: medium
  pick-place: hard
  stick-push: very hard
  shelf-place: very hard
