# 3D-MVP condition A, "3D-MVP, multi-view RGB-D + extrinsics (privileged)" (reimplemented; Qi et al., CVPR 2025 on
# RVT-1). Per episode three of the six training cameras, drawn at random and fixed within the episode (SNeRL's camera
# protocol); their RGB-D + K + c2w are fused into one point cloud -> 5 virtual views -> frozen E -> per-view max-pool
# (5 x 256) per frame -> FrameMLPStackHead over the 3 frames, feature_dim 256, no image augmentation. Viewpoint-shift
# evaluation keeps two of the three cameras and replaces the third (s4d/rl/evaluate.py, multiview_groups).
# Same pretrained encoder as condition B (mvp3d_single.yaml). See docs/baselines_mvp3d.md.
vision:
  encoder_type: mvp3d
  export_path: null   # set on the command line: vision.export_path=<runs/pretrain/<name>/encoder.pt>
env:
  views: 3
  depth: true
  cameras: true
agent:
  feature_dim: 256
