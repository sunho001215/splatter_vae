# 3D-MVP condition B, "3D-MVP, single RGB-D + extrinsics (privileged)" (reimplemented; our added single-camera
# condition). One random training camera per episode, as for the single-camera methods; its RGB-D + K + c2w -> point
# cloud (sparser than the fused six-camera clouds of pretraining) -> 5 virtual views -> frozen E -> per-view max-pool
# (5 x 256) per frame -> FrameMLPStackHead over the 3 frames, feature_dim 256, no image augmentation. Same
# viewpoint-shift evaluation as the single-camera methods. Same pretrained encoder as condition A
# (mvp3d_multiview.yaml). See docs/baselines_mvp3d.md.
vision:
  encoder_type: mvp3d
  export_path: null   # set on the command line: vision.export_path=<runs/pretrain/<name>/encoder.pt>
env:
  views: 1
  depth: true
  cameras: true
agent:
  feature_dim: 256
