# Unified training pool (user directive 2026-11-11 ~20:15 KST). Both scheduler hosts admit all training families.
# Placement depends on GPU/RAM capacity and verified data accessibility; started rows migrate only explicitly.
# Remote-resident inputs require a local resolver (ops/jobs/realworld_local.py); preprocessing and typed release
# verification stay remote. The RTX 5090 inference host never schedules. Holds apply only to their host/queue.
# GPU allowlists, runtime roots and resource/transfer limits remain in the host configs, queue and ops/resources.
# Classification is unchanged: explicit role (validated against domain evidence), then script/config/data/dependencies.
version: 2
directive: "user 2026-11-11 ~20:15 KST: unified training pool; data locality and host-specific holds retained"
data_locality:
  remote_resident: [realworld_preprocess, droid_preprocess, realworld_pretrain, droid_pretrain, realworld_fql]
classes:
  metaworld: "Meta-World simulation and everything built on Meta-World data: pretraining, exports, evaluations, DrM (and the paused RL algorithms), data collection, analysis, architecture / parameter selection"
  realworld_preprocess: "real-world episode validation and preprocessing (calibration, FoundationStereo, depth, TrackEverything, SAM 3 / DINO features for baselines)"
  droid_preprocess: "DROID preprocessing (PointWorld depth / tracks reuse, DROID-3D calibration, manifests, indices)"
  realworld_pretrain: "representation pretraining and encoder export on real-world data (baselines and ours)"
  droid_pretrain: "representation pretraining and encoder export on DROID"
  realworld_fql: "real-world offline FQL training and offline evaluation (never commands the physical robot)"
  verification: "typed release verification rows (ops/containers/verification.py: native suite, GPU isolation)"
hosts:
  local:
    scheduler: true
    admit: [metaworld, realworld_pretrain, droid_pretrain, realworld_fql]
    # rows without any domain evidence (diagnostics, test workers): admitted, as before the role separation; rows with
    # real-world / DROID evidence require the explicit admission above
    unknown: allow
  remote:
    scheduler: true
    admit: [metaworld, realworld_preprocess, droid_preprocess, realworld_pretrain, droid_pretrain, realworld_fql, verification]
    unknown: allow
    # drain exception (coordinator, 2026-11-06): while remote Meta-World work drains, the evaluator companion
    # (<trainer>-eval, scripts/eval_rl.py) of a trainer running or completed on this host may still be admitted here
    # (it reads the trainer's snapshots, which exist only here). Admission only: the pool never moves rows by it.
    drain_evaluators: true
  inference:
    # RTX 5090 (irsl, container shkim_rw, one GPU): lightweight inference / rendering / visualization only, through
    # ops/inference_server; never a scheduler host (no training, no bulk preprocessing)
    scheduler: false
    admit: []
    unknown: deny
