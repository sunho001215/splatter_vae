dataset:
  source_root: /home/ws/data/droid
  preprocessed_root: /home/ws/data/droid_stage0_preprocessed
  calibration_manifest: /ws/data/ws/droid_splattervae/manifests/canonical-full/calibration.jsonl.gz
  eligibility: canonical_stage0_calibration_valid_only
  retained_raw_stride: 3
  temporal_gap_raw: 6
  temporal_window: 3
  exterior_cameras: 2
  per_gpu_logical_batch: 8
  workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  drop_last: true
  reader_cache_size: 8
  verify_member_checksums: false
  seed: 42

storage:
  container: indexed_uncompressed_tar
  target_retained_timesteps_per_shard: 4096
  jpeg:
    format: jpeg
    quality: 95
    chroma_subsampling: "4:4:4"
    optimize: false
    progressive: false
  numeric:
    container: blosc
    codec: zstd
    compression_level: 3
    shuffle: bitshuffle

preprocessing:
  source_width: 320
  source_height: 180
  padded_size: 320
  pad_top: 70
  pad_bottom: 70
  padding_value: imagenet_mean
  output_size: 224
  rgb_normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  crop:
    min_size: 180
    max_size: 320
    size_sampling: uniform
    center_mode: middle_frame_forward_megaflow_argmax
    flow_alignment: forward_splat_f01_to_t1_then_max_f12
    flow_aggregation: max
    flow_smoothing_kernel: 15
    low_motion_threshold: 1.0e-4
    low_motion_fallback: image_center

calibration:
  eligibility_stage: 0
  exterior_cameras_only: true
  world_frame: robot_base
  intrinsics_convention: opencv_pixel_center
  stored_extrinsics: [c2w, w2c]

depth:
  source: cached_da3
  repository: ByteDance-Seed/Depth-Anything-3
  repository_revision: 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
  model_id: depth-anything/DA3NESTED-GIANT-LARGE-1.1
  checkpoint_revision: b2359bdf726fb44ef62acca04d629dcf158053e7
  synchronized_views_per_inference: 2
  resolution: [180, 320]
  encoding: uint16_mm
  invalid_value: 0
  meters_per_unit: 0.001
  metric_depth_weight: 0.5
  scale_invariant_depth_weight: 0.25
  scale_invariant_mean_weight: 1.0

flow:
  source: cached_megaflow
  repository: cvg/megaflow
  repository_revision: ee5b61813db0a76ac0db9034899aade72a0d230c
  model_id: megaflow-flow
  checkpoint_repository: Kristen-Z/MegaFlow
  checkpoint_revision: b4c5c33800b8fa88e047d2eb70ae74b0feca606d
  gap_raw_timesteps: 6
  direction: forward_only
  resolution: [180, 320]
  encoding: int16_fixed_1_over_64
  fixed_point_scale: 64
  invalid_sentinel: -32768
  weight: 0.1
  pair_weights: [0.5, 0.5]
  alpha_threshold: 0.01
  smooth_l1_beta: 1.0

novel_view:
  enabled: true
  source: cached_lagernvs
  repository: facebookresearch/lagernvs
  repository_revision: 665f727aba8298a04ff4c040fd6279a32ef23017
  model_id: facebook/lagernvs_dl3dv_2-6_v_256
  checkpoint_revision: 4026552953a72c5fb037501564dc673dd73c574e
  targets_per_timestep: 4
  canonical_size: 256
  canonical_focal_px: 186.5
  target_distribution:
    cam_a_alpha_bands: [[0.15, 0.25], [0.25, 0.35]]
    mirror_about_one_half: true
    excluded_center: [0.35, 0.65]
    deterministic_per_episode_timestep: true
  target_pose:
    mode: interpolate_with_bounded_perturbation
    prefer_scene_centered_arc: true
    translation_max_baseline_fraction: 0.03
    exceptional_safety_translation_max_baseline_fraction: 0.05
    exceptional_translation_keeps_strict_geometry_gates: true
    last_resort_safety_thresholds_explicitly_flagged: true
    rotation_max_degrees: 3.0
    minimum_geometry_distance_m: 0.08
    exceptional_minimum_geometry_distance_m: 0.05
    source_clearance_reference_fraction: 0.80
    minimum_source_calibrated_clearance_m: 0.02
    geometry_clearance_quantile: 0.01
    minimum_optical_axis_cosine: 0.35
    min_source_coverage: 0.60
    exceptional_min_source_coverage: 0.40
    coverage_sample_stride: 2
    coverage_dilation_kernel: 7
    max_resample_attempts: 4
    alpha_safety_grid_candidates: 17
  support_mask:
    stored: true
    encoding: bitpacked
  loss:
    reduction: mean_over_batch_time_targets_and_supported_pixels
    weight: 0.05
    supported_weight: 1.0
    unsupported_weight: 0.0

masking:
  ratio: 0.60
  validity_aware: true
  fully_padded_patches_invalid: true
  partially_valid_patches_valid: true
  tube_mask: true
  motion_visible_fraction: 0.50
  variable_keep_count: true
  batch_token_padding: true

vit:
  image_size: 224
  patch_size: 16
  input_channels: 3
  embed_dimension: 384
  depth: 12
  num_heads: 6
  qkv_bias: true
  normalization: rmsnorm
  swiglu_hidden_dimension: 1024
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1
  layerscale_initial_value: 1.0e-5
  temporal_window: 3
  initialize_from: scratch

model:
  temporal_anchor: current
  motion_translation_max_m: 0.25

contrastive:
  projector_hidden_dimension: 1024
  projector_output_dimension: 256
  temperature: 0.10
  weight: 1.0
  distributed_negatives: true

decoder:
  num_groups: 256
  gaussians_per_group: 8
  dimension: 256
  depth: 2
  num_heads: 8
  swiglu_hidden_dimension: 512
  use_self_attention: true
  conditioning: multi_token_cross_attention
  # Validated on the representative schema-2 cached-DA3 pilot. Recompute over
  # the completed cache before the long representation-training run.
  workspace_parameter_status: validated_from_cached_da3_pilot
  require_validated_workspace_parameters: true
  global_center: [0.6023508516, 0.1065550001, 0.0717650620]
  anchor_initial_spread: 0.3912640560
  parent_displacement_scale: 0.2574517488
  child_radius: 0.0450540560

renderer:
  image_height: 224
  image_width: 224
  znear: 0.0775000006
  zfar: 3.9768001556
  white_background: false
  max_sh_degree: 1
  scale_min: [0.001, 0.001, 0.001]
  scale_max: [0.08, 0.08, 0.08]

loss:
  rgb_l1: 1.0
  ssim: 0.2
  visibility: 0.05
  gaussian_regularization: 0.01

optimizer:
  name: adamw
  reference_lr: 1.5e-4
  reference_batch_size: 256
  decoder_lr_multiplier: 2.0
  betas: [0.9, 0.95]
  weight_decay: 0.05
  min_lr: 1.0e-6
  warmup_fraction: 0.05
  warmup_steps: 10000
  schedule: cosine
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 4
  num_epochs: 100
  max_global_steps: 300000
  bf16: true
  tf32: true

distributed:
  backend: nccl
  use_ddp: true
  find_unused_parameters: false

logging:
  wandb_enabled: false
  wandb_project: splattervae-droid
  wandb_entity: null
  run_name: null
  checkpoint_dir: /home/ws/ws/droid_training/outputs/cached_stage0_checkpoints
  visualization_dir: /home/ws/ws/droid_training/outputs/visualization
  scalar_every_steps: 50
  validation_every_steps: 2000
  checkpoint_every_steps: 5000
  visualization_every_steps: 5000
  validation_batches: 8
  num_visualization_samples: 2
  depth_display_range_m: [0.10, 4.0]

workspace_statistics:
  source: cached_da3
  output_path: /home/ws/data/droid_stage0_preprocessed/metadata/workspace_stats.json
  maximum_episodes: 2000
  frames_per_episode: 8
  maximum_axis_intersection_residual_m: 0.35
  workspace_geometry_radius_m: 1.0
  depth_percentiles: [1.0, 5.0, 50.0, 95.0, 99.0]
  coordinate_percentiles: [1.0, 5.0, 50.0, 95.0, 99.0]
