dataset:
  droid_root: /home/ws/data/droid
  derived_root: /ws/data/ws/droid_splattervae
  calibration_manifest: /ws/data/ws/droid_splattervae/manifests/canonical-full/calibration.jsonl.gz
  split_manifest: /ws/data/ws/droid_splattervae/manifests/canonical-full/episode_splits.json
  validation_fraction: 0.02
  split_seed: 42
  seed: 42
  temporal_strides: [1, 3, 6]
  temporal_probabilities: [0.40, 0.35, 0.25]
  validation_stride: 3
  per_gpu_logical_batch: 8
  workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  drop_last: true

preprocessing:
  source_width: 320
  source_height: 180
  padded_size: 320
  pad_top: 70
  pad_bottom: 70
  padding_value: imagenet_mean
  output_size: 224
  rgb_normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  crop:
    min_size: 180
    max_size: 320
    size_sampling: uniform
    center_mode: optical_flow_argmax
    flow_aggregation: max
    flow_smoothing_kernel: 15
    low_motion_threshold: 1.0e-4
    low_motion_fallback: image_center

calibration:
  official_repository: KarlP/droid
  official_revision: main
  use_exterior_cameras_only: true
  world_frame: robot_base
  stage: 0
  thresholds:
    rotation_orthonormal_atol: 0.02
    rotation_determinant_atol: 0.02
    maximum_translation_m: 5.0
    minimum_exterior_baseline_m: 0.05
    maximum_exterior_baseline_m: 3.0
    principal_point_margin_fraction: 0.25
    direct_relative_max_rotation_deg: 20.0
    direct_relative_max_translation_m: 0.35
    direction_minimum_samples: 100
    direction_maximum_samples: 25000

vit:
  image_size: 224
  patch_size: 16
  input_channels: 3
  embed_dimension: 384
  depth: 12
  num_heads: 6
  qkv_bias: true
  normalization: rmsnorm
  swiglu_hidden_dimension: 1024
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1
  layerscale_initial_value: 1.0e-5
  temporal_window: 3
  initialize_from: scratch

model:
  temporal_anchor: current
  masking_ratio: 0.60
  motion_visible_fraction: 0.50
  motion_translation_max_m: 0.25

contrastive:
  projector_hidden_dimension: 1024
  projector_output_dimension: 256
  temperature: 0.10
  weight: 1.0
  distributed_negatives: true

decoder:
  num_groups: 256
  gaussians_per_group: 8
  dimension: 256
  depth: 2
  num_heads: 8
  swiglu_hidden_dimension: 512
  use_self_attention: true
  conditioning: multi_token_cross_attention
  # Derived from 76 calibration-valid real episodes x three frames using
  # online X-Lens and validated by the 10-step real-DROID optimizer pilot.
  workspace_parameter_status: validated_from_droid_xlens_stats_and_pilot
  require_validated_workspace_parameters: true
  global_center: [0.6268912475, 0.0371947839, 0.1571336175]
  anchor_initial_spread: 0.4632105128
  parent_displacement_scale: 0.3047925174
  child_radius: 0.0533386905

renderer:
  image_height: 224
  image_width: 224
  znear: 0.2928879559
  zfar: 7.3070499287
  white_background: false
  max_sh_degree: 1
  scale_min: [0.001, 0.001, 0.001]
  scale_max: [0.08, 0.08, 0.08]

depth:
  teacher: xlens
  official_repo_path: /home/ws/ws/droid_training/third_party/XLens
  checkpoint_path: /home/ws/ws/droid_training/checkpoints/xlens/model.safetensors
  architecture_config: /home/ws/ws/droid_training/third_party/XLens/configs/xlens_vits.yaml
  amp_dtype: bf16
  inference_resolution: [320, 180]
  confidence_threshold: 0.0
  metric_depth_weight: 0.5
  scale_invariant_depth_weight: 0.25
  scale_invariant_mean_weight: 1.0

flow:
  backend: memfof
  official_repo_path: /home/ws/ws/droid_training/third_party/MEMFOF
  official_repository_revision: a51de9fc59c6fe20ba08e079372c7b583d58a712
  checkpoint: egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH
  checkpoint_revision: 6c6c9aa3ad64f93aee8efbc2f7a6e4535814ee96
  cache_dir: /home/ws/ws/droid_training/checkpoints/huggingface
  native_resolution: true
  input_height: 180
  input_width: 320
  iterations: 2
  precision: fp32
  weight: 0.1
  pair_weights: [0.5, 0.5]
  alpha_threshold: 0.01
  smooth_l1_beta: 1.0

novel_view:
  enabled: false
  backend: lagernvs
  official_repo_path: /home/ws/ws/droid_training/third_party/LagerNVS
  official_repository_revision: 665f727aba8298a04ff4c040fd6279a32ef23017
  checkpoint_id: facebook/lagernvs_dl3dv_2-6_v_256
  checkpoint_revision: 4026552953a72c5fb037501564dc673dd73c574e
  checkpoint_path: null
  cache_dir: /home/ws/ws/droid_training/checkpoints/huggingface
  dtype: bf16
  microbatch_size: 4
  canonical:
    image_size: 256
    focal_px: 186.5
    deterministic: true
    source_cameras: exterior_only
  target_pose:
    mode: interpolate_with_bounded_perturbation
    alpha_min: 0.15
    alpha_max: 0.85
    prefer_scene_centered_arc: true
    scene_center: null
    translation_max_baseline_fraction: 0.03
    rotation_max_degrees: 3.0
    min_source_coverage: 0.60
    max_resample_attempts: 4
    minimum_geometry_distance_m: 0.08
    minimum_optical_axis_cosine: 0.35
    coverage_confidence_threshold: 0.0
    coverage_sample_stride: 2
    coverage_dilation_kernel: 5
  loss:
    weight: 0.05
    supported_weight: 1.0
    unsupported_weight: 0.0

loss:
  rgb_l1: 1.0
  ssim: 0.2
  visibility: 0.05
  gaussian_regularization: 0.01

optimizer:
  name: adamw
  reference_lr: 1.5e-4
  reference_batch_size: 256
  decoder_lr_multiplier: 2.0
  betas: [0.9, 0.95]
  weight_decay: 0.05
  min_lr: 1.0e-6
  warmup_fraction: 0.05
  warmup_steps: 10000
  schedule: cosine
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 4
  num_epochs: 100
  max_global_steps: 300000
  bf16: true
  tf32: true

distributed:
  backend: nccl
  use_ddp: true
  find_unused_parameters: false

logging:
  wandb_enabled: false
  wandb_project: splattervae-droid
  wandb_entity: null
  run_name: null
  checkpoint_dir: /ws/data/ws/droid_splattervae/logs/checkpoints
  visualization_dir: /home/ws/ws/droid_training/outputs/visualization
  scalar_every_steps: 50
  validation_every_steps: 2000
  checkpoint_every_steps: 5000
  visualization_every_steps: 5000
  validation_batches: 8
  num_visualization_samples: 2
  depth_display_range_m: [0.25, 5.0]

workspace_statistics:
  output_path: /ws/data/ws/droid_splattervae/workspace_stats/workspace_stats.json
  maximum_episodes: 2000
  frames_per_episode: 8
  depth_confidence_threshold: 0.5
  maximum_axis_intersection_residual_m: 0.35
  workspace_geometry_radius_m: 1.0
  depth_percentiles: [1.0, 5.0, 50.0, 95.0, 99.0]
  coordinate_percentiles: [1.0, 5.0, 50.0, 95.0, 99.0]
