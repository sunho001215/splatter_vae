# -----------------------------------------------------------------------------
# Dataset / dataloader
# -----------------------------------------------------------------------------
dataset:
  hdf5_paths:
    - "../../data/metaworld/with-depth/coffee-push.hdf5"
  batch_size: 8
  num_workers: 8
  pin_memory: true
  train_ratio: 0.96
  seed: 42
  num_episodes: null
  max_frames_per_demo: null
  camera_num: 24
  use_depth: true
  use_segmentation_mask: false
  # Fill this after running dataset/metaworld_demo_collect/inspect_segmentation_ids.py.
  selected_seg_ids:
    default: []

# -----------------------------------------------------------------------------
# Model wrapper settings
# -----------------------------------------------------------------------------
model:
  fusion_style: "plus"         # ["cat", "plus"]
  use_dependent_vq: true
  is_dependent_ae: false
  use_invariant_vq: true
  is_invariant_ae: false
  dep_input_mask_ratio: 0.0
  dep_mask_eval: false

# -----------------------------------------------------------------------------
# Invariant / dependent codebooks
# -----------------------------------------------------------------------------
codebook:
  invariant:
    quantizer: fsq
    embed_dim: 6
    fsq_levels: [8, 8, 8, 5, 5, 5]

  dependent:
    quantizer: fsq
    embed_dim: 6
    fsq_levels: [8, 8, 8, 5, 5, 5]

# -----------------------------------------------------------------------------
# ViT encoders + token transformer + DPT decoder
# -----------------------------------------------------------------------------
vit:
  # Encoder ViT hyperparameters
  patch_size: 16
  in_chans: 3
  embed_dim: 128
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: true
  dropout: 0.0
  attn_dropout: 0.0
  drop_path_rate: 0.1
  layerscale_init: 1.0e-5

  # Four tap points required by the DPT-style decoder.
  selected_layers: [1, 3, 5, 7]

  # Decoder-side token transformer before the DPT dense head.
  decoder_depth: 8
  decoder_num_heads: 8
  decoder_mlp_ratio: 4.0
  decoder_drop_path_rate: 0.1
  decoder_selected_layers: [1, 3, 5, 7]

  # DPT dense decoder width.
  dpt_features: 128

# -----------------------------------------------------------------------------
# Splatter / Gaussian parameterization
# -----------------------------------------------------------------------------
splatter:
  data:
    img_height: 128
    img_width: 128
    znear: 0.1
    zfar: 2.5
    white_background: false
    inverted_x: false
    inverted_y: false
    category: "generic"

  model:
    # Direct per-pixel Gaussian layout
    max_sh_degree: 1
    gaussians_per_pixel: 1
    depth_min: null
    depth_max: null
    depth_activation: inverse_depth
    depth_ordering: sort
    depth_scale: 1.0
    depth_bias: 0.0
    gaussian_offset_scale: 0.05
    offset_scale: 1.0
    offset_bias: 0.0
    gaussian_scale_min: 1.0e-4
    gaussian_scale_max: 0.05
    scale_scale: 1.0
    scale_bias: 0.0
    rotation_scale: 1.0
    rotation_bias: 0.0
    opacity_scale: 1.0
    opacity_bias: 0.0
    color_scale: 1.0
    color_bias: 0.0
    sh_rest_scale: 0.1
    sh_rest_raw_scale: 1.0
    sh_rest_raw_bias: 0.0

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
train:
  num_epochs: 100
  max_global_steps: 300001
  lr: 5.0e-4
  lr_schedule: warmup_cosine
  lr_warmup_steps: 10000
  min_lr: 5.0e-5
  device: cuda

  # Direct Gaussian masked-rendering and Chamfer loss weights.
  rec_weight: 1.0
  ssim_weight: 0.0
  rec_background_weight: 0.05
  point_chamfer_weight: 5.0
  chamfer_huber_delta: 0.05
  vq_weight: 0.25
  inv_contrastive_weight: 1.0
  inv_consistency_weight: 0.5
  dep_contrastive_weight: 0.1
  dep_consistency_weight: 0.1

  temperature: 0.1

  eval_every: 1000
  save_every: 10000 
  ckpt_dir: ./checkpoints/metaworld/encoders/SplatterVAE-fsq/coffee-push/direct-gaussian-masked/
  resume_from_last: false
  val_log_pointclouds: true
  val_pointcloud_max_points: 4096

# -----------------------------------------------------------------------------
# Optional logging
# -----------------------------------------------------------------------------
wandb:
  enabled: true
  project: metaworld-SplatterVAE
  entity: null
  run_name: metaworld-coffee-push-direct-gaussian-masked
  tags:
    - direct-gaussian-masked
    - gaussian-center-chamfer
    - max_sh_degree-1
    - all-camera-rendering
    - rgb-encoder
    - embed-dim-128
    - codebook-embed-dim-64
    - transformer-depth-8
    - num-heads-8
    - DPT-fix
    - lr-5e-4
    - diverse-demo-collection
    - ssim_weight-0.0
    - VQ-codebook
    - consistency-loss
