# -----------------------------------------------------------------------------
# Dataset / dataloader
# -----------------------------------------------------------------------------
dataset:
  hdf5_paths:
    - "../../data/metaworld/pre-training/hammer.hdf5"
  batch_size: 8
  num_workers: 8
  pin_memory: true
  train_ratio: 0.96
  seed: 42
  num_episodes: null
  max_frames_per_demo: null
  temporal_window: 3
  temporal_stride_list: [3, 6, 9, 12, 15, 18, 21]
  temporal_min_state_change: 0.02
  temporal_gripper_change_weight: 0.05
  camera_num: 6
  use_depth: true
  use_segmentation_mask: true
  selected_seg_ids:
    default: ["geom:24", "geom:25", "geom:13", "geom:22", "geom:19", "geom:16", "geom:21", "geom:27", "geom:28", "geom:31", "geom:33", "geom:29", "geom:36", "geom:40", "geom:39", "geom:37", "geom:38", "geom:41", "geom:48", "geom:53", "site:5", "site:4"]

# -----------------------------------------------------------------------------
# Model wrapper settings
# -----------------------------------------------------------------------------
model:
  temporal_window: 3
  inv_tube_mask_ratio: 0.50
  dep_mask_ratio: 0.75
  tube_mask_per_view: true
  use_single_state_vector: true
  state_dim: 256
  view_dim: 64
  decoder_condition_mode: concat
  dependent_uses_first_timestep_only: true
  dep_mask_eval: true
  motion_graph_hidden_dim: 128
  motion_graph_num_layers: 2
  motion_graph_num_neighbors: 8
  dynamic_patch_threshold: 0.05

# -----------------------------------------------------------------------------
# ViT encoders + token transformer + DPT decoder
# -----------------------------------------------------------------------------
vit:
  # Encoder ViT hyperparameters
  patch_size: 16
  in_chans: 3
  embed_dim: 128
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: true
  dropout: 0.0
  attn_dropout: 0.0
  drop_path_rate: 0.1
  layerscale_init: 1.0

  # Four tap points required by the DPT-style decoder.
  selected_layers: [1, 3, 5, 7]

  # Decoder-side token transformer before the DPT dense head.
  decoder_depth: 8
  decoder_num_heads: 8
  decoder_mlp_ratio: 4.0
  decoder_drop_path_rate: 0.1
  decoder_selected_layers: [1, 3, 5, 7]

  # DPT dense decoder width.
  dpt_features: 128

# -----------------------------------------------------------------------------
# Splatter / Gaussian parameterization
# -----------------------------------------------------------------------------
splatter:
  data:
    img_height: 128
    img_width: 128
    znear: 0.1
    zfar: 2.5
    white_background: false
    inverted_x: false
    inverted_y: false
    category: "generic"

  model:
    # Direct per-pixel Gaussian layout
    max_sh_degree: 1
    gaussians_per_pixel: 1
    depth_min: null
    depth_max: null
    depth_activation: linear
    depth_ordering: sort
    depth_scale: 1.0
    depth_bias: 0.0
    gaussian_offset_scale: 0.05
    offset_scale: 1.0
    offset_bias: 0.0
    gaussian_scale_min: 1.0e-4
    gaussian_scale_max: 0.05
    scale_scale: 0.05
    scale_bias: -4.0
    rotation_scale: 1.0
    rotation_bias: 0.0
    opacity_scale: 1.0
    opacity_bias: 2.0
    color_scale: 1.0
    color_bias: 0.0
    sh_rest_scale: 0.1
    sh_rest_raw_scale: 1.0
    sh_rest_raw_bias: 0.0

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
train:
  num_epochs: 100
  max_global_steps: 500001
  lr: 3.0e-4
  lr_schedule: warmup_cosine
  lr_warmup_steps: 10000
  min_lr: 5.0e-5
  device: cuda

  # Unified RGB, silhouette, and expected-depth supervision.
  rec_weight: 1.0
  ssim_weight: 0.2
  silhouette_weight: 0.1
  global_depth_weight: 0.1
  local_depth_weight: 1.0
  local_depth_min_patch_size: 8
  local_depth_max_patch_size: 32
  local_depth_min_valid_pixels: 16

  # Sparse persistent motion controls and fixed t0 interpolation.
  num_motion_controls: 256
  motion_num_neighbors: 4
  motion_delta_max: 0.5

  inv_contrastive_weight: 1.0
  inv_consistency_weight: 0.5
  dep_contrastive_weight: 0.1
  dep_consistency_weight: 0.1

  temperature: 0.1

  eval_every: 1000
  save_every: 10000 
  ckpt_dir: ./checkpoints/metaworld/encoders/SplatterVAE-temporal/hammer/sparse-controls/
  resume_from_last: false
  val_log_pointclouds: true
  val_pointcloud_max_points: 4096
  val_track_max_points: 8

# -----------------------------------------------------------------------------
# Optional logging
# -----------------------------------------------------------------------------
wandb:
  enabled: true
  project: metaworld-SplatterVAE
  entity: null
  run_name: metaworld-hammer-temporal-sparse-controls
  tags:
    - temporal-state-bottleneck
    - film-query-decoder
    - sparse-control-motion
    - sequence-rendering
    - diverse-demo-collection
    - state-vector-contrastive
