# -----------------------------------------------------------------------------
# Dataset / dataloader
# -----------------------------------------------------------------------------
dataset:
  hdf5_paths:
    - "../../data/metaworld/pre-training/faucet-close.hdf5"
  batch_size: 8
  num_workers: 8
  pin_memory: true
  train_ratio: 0.96
  seed: 42
  num_episodes: null
  max_frames_per_demo: null
  views: [cam0, cam1, cam2, cam3, cam4, cam5]
  train_temporal_strides: [3, 6, 9]
  validation_temporal_stride: 9
  selected_seg_ids:
    default: ["geom:25", "geom:24", "geom:13", "geom:19", "geom:16", "geom:22", "geom:27", "geom:28", "geom:33", "geom:31", "geom:29", "geom:36", "geom:41", "geom:40", "geom:39", "site:7", "site:6", "site:9", "site:0", "site:1", "site:10"]

# -----------------------------------------------------------------------------
# Model wrapper settings
# -----------------------------------------------------------------------------
optical_flow_preprocessing:
  model: SEA-RAFT
  checkpoint: pretrained_checkpoint
  output_dtype: float16
  temporal_gaps: [3, 6, 9, 12, 18]
  compression: lzf
  overwrite_existing: false

model:
  inv_tube_mask_ratio: 0.50
  dep_mask_ratio: 0.75
  tube_mask_per_view: true
  state_dim: 256
  view_dim: 64
  decoder_condition_mode: concat
  dep_mask_eval: true
  flow_patch_threshold_pixels: 0.5
  motion_translation_max: 0.5

# -----------------------------------------------------------------------------
# ViT encoders + token transformer + DPT decoder
# -----------------------------------------------------------------------------
vit:
  # Encoder ViT hyperparameters
  patch_size: 16
  in_chans: 3
  embed_dim: 128
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: true
  dropout: 0.0
  attn_dropout: 0.0
  drop_path_rate: 0.1
  layerscale_init: 1.0

  # Four tap points required by the DPT-style decoder.
  selected_layers: [1, 3, 5, 7]

  # Decoder-side token transformer before the DPT dense head.
  decoder_depth: 8
  decoder_num_heads: 8
  decoder_mlp_ratio: 4.0
  decoder_drop_path_rate: 0.1
  decoder_selected_layers: [1, 3, 5, 7]

  # DPT dense decoder width.
  dpt_features: 128

# -----------------------------------------------------------------------------
# Splatter / Gaussian parameterization
# -----------------------------------------------------------------------------
splatter:
  data:
    img_height: 128
    img_width: 128
    znear: 0.1
    zfar: 2.0
    white_background: false

  model:
    # Direct per-pixel Gaussian layout
    max_sh_degree: 1
    gaussians_per_pixel: 1
    depth_min: null
    depth_max: null
    depth_activation: linear
    depth_ordering: sort
    depth_scale: 1.0
    depth_bias: 0.0
    gaussian_offset_scale: 0.05
    offset_scale: 1.0
    offset_bias: 0.0
    gaussian_scale_min: 1.0e-4
    gaussian_scale_max: 0.05
    scale_scale: 0.05
    scale_bias: -1.5
    rotation_scale: 1.0
    rotation_bias: 0.0
    opacity_scale: 1.0
    opacity_bias: 2.0
    color_scale: 1.0
    color_bias: 0.0
    sh_rest_scale: 0.1
    sh_rest_raw_scale: 1.0
    sh_rest_raw_bias: 0.0

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
train:
  num_epochs: 100
  max_global_steps: 500001
  lr: 1.0e-4
  lr_schedule: cosine
  lr_warmup_steps: 10000
  min_lr: 1.0e-5
  temporal_loss_ramp_steps: 20000
  flow_weight: 0.1
  flow_alpha_threshold: 0.01
  flow_smooth_l1_beta: 1.0
  dynamic_region_weight: 1.0
  frustum_weight: 0.01
  device: cuda

  # Unified RGB, silhouette, and expected-depth supervision.
  rec_weight: 1.0
  ssim_weight: 0.2
  silhouette_weight: 0.1
  global_depth_weight: 0.1
  local_depth_weight: 1.0
  local_depth_min_patch_size: 8
  local_depth_max_patch_size: 32
  local_depth_min_valid_pixels: 16

  inv_contrastive_weight: 1.0
  inv_consistency_weight: 0.5
  dep_contrastive_weight: 0.1
  dep_consistency_weight: 0.1

  temperature: 0.1
  scalar_log_every: 250
  val_num_batches: 2

  eval_every: 1000
  save_every: 10000 
  ckpt_dir: ./checkpoints/metaworld/encoders/SplatterVAE-temporal/faucet-close/dense-flow/
  resume_from_last: true
  val_pointcloud_max_points: 4096

# -----------------------------------------------------------------------------
# Optional logging
# -----------------------------------------------------------------------------
wandb:
  enabled: true
  scalar_log_every: 250
  use_compact_logging: true
  use_qualitative_table: true
  project: metaworld-SplatterVAE
  entity: null
  run_name: metaworld-faucet-close-temporal-dense-flow
  tags:
    - temporal-state-bottleneck
    - film-query-decoder
    - dense-gaussian-motion
    - sea-raft-flow
    - sequence-rendering
    - diverse-demo-collection
    - state-vector-contrastive
