seed: 98
device: cuda

wandb:
  enabled: true
  project: metaworld-door-open-DrQv2
  name: SplatterVAE-temporal-state
  tags: [full-implementation, embed-dim-128]

env:
  benchmark_id: Meta-World/MT1
  env_name: door-open
  image_height: 128
  image_width: 128
  frame_stack: 3
  action_repeat: 2
  max_episode_steps: 250

  cameras:
    - name: cam0
      r: 1.0
      theta: 45.0
      phi: 0.0
      fovy: 45.0
    - name: cam1
      r: 1.0
      theta: 45.0       
      phi: 180.0          
      fovy: 45.0
    - name: cam2
      r: 1.0
      theta: 60.0        
      phi: -30.0             
      fovy: 45.0
    - name: cam3
      r: 1.0
      theta: 60.0         
      phi: 210.0           
      fovy: 45.0
    - name: cam4
      r: 1.0
      theta: 30.0       
      phi: 30.0
      fovy: 45.0
    - name: cam5
      r: 1.0
      theta: 30.0     
      phi: 150.0
      fovy: 45.0

  lookat: [0.0, 0.6, 0.0]
  up: [0.0, 0.0, 1.0]

vision:
  encoder_type: splatter_vae
  img_height: 128
  img_width: 128

  vit:
    patch_size: 16
    in_chans: 3
    embed_dim: 128
    depth: 8
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: true
    dropout: 0.0
    attn_dropout: 0.0
    drop_path_rate: 0.1
    layerscale_init: 1.0
    selected_layers: [1, 3, 5, 7]
    decoder_depth: 8
    decoder_num_heads: 8
    decoder_mlp_ratio: 4.0
    decoder_drop_path_rate: 0.1
    decoder_selected_layers: [1, 3, 5, 7]
    dpt_features: 128

  splatter_vae:
    checkpoint_path: ./checkpoints/metaworld/encoders/SplatterVAE-temporal/door-open/dense-flow/step_00300000.pth
    max_sh_degree: 1
    gaussians_per_pixel: 1

    model:
      inv_tube_mask_ratio: 0.50
      dep_mask_ratio: 0.75
      tube_mask_per_view: true
      state_dim: 256
      view_dim: 64
      dep_mask_eval: false
      flow_patch_threshold_pixels: 0.5
      motion_translation_max: 0.5
      temporal_modeling: true  # false: encode each policy frame independently

agent:
  lr: 1.0e-4
  feature_dim: 256
  hidden_dim: 1024
  augment_pixels: false
  critic_target_tau: 0.01
  stddev_schedule: linear(1.0,0.1,500000)
  stddev_clip: 0.3

train:
  num_train_steps: 1000000
  seed_steps: 4000
  batch_size: 256
  replay_size: 1000000
  update_every_steps: 2
  gradient_steps: 1
  discount: 0.99

  replay_dir: ./buffer/metaworld/door-open/splattervae_temporal_state/seed98/
  replay_num_workers: 4
  nstep: 3

  log_every_steps: 1000
  eval_every_steps: 10000
  num_eval_episodes: 120
  rolling_window: 10

  checkpoint_every_steps: 50000
  checkpoint_dir: ./checkpoints/metaworld/policies/drqv2/splattervae_temporal_state/door-open/seed98/

visualization:
  enabled: false
  window_name: metaworld_door-open_drqv2
  wait_key: 1
  scale: 1.0
