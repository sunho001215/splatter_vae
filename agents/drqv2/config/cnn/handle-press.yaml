seed: 42
device: cuda

wandb:
  enabled: true
  project: metaworld-handle-press-DrQv2
  name: CNN

env:
  benchmark_id: Meta-World/MT1
  env_name: handle-press
  image_height: 128
  image_width: 128
  frame_stack: 3
  action_repeat: 2
  max_episode_steps: 250

  cameras:
    - name: cam0
      r: 1.0
      theta: 45.0
      phi: 0.0
      fovy: 45.0
    - name: cam1
      r: 1.0
      theta: 45.0       
      phi: 180.0          
      fovy: 45.0
    - name: cam2
      r: 1.0
      theta: 60.0        
      phi: -30.0             
      fovy: 45.0
    - name: cam3
      r: 1.0
      theta: 60.0         
      phi: 210.0           
      fovy: 45.0
    - name: cam4
      r: 1.0
      theta: 30.0       
      phi: 30.0
      fovy: 45.0
    - name: cam5
      r: 1.0
      theta: 30.0     
      phi: 150.0
      fovy: 45.0

  lookat: [0.0, 0.6, 0.0]
  up: [0.0, 0.0, 1.0]

vision:
  encoder_type: convnet


agent:
  lr: 1.0e-4
  feature_dim: 50
  hidden_dim: 1024
  critic_target_tau: 0.01
  stddev_schedule: linear(1.0,0.1,500000)
  stddev_clip: 0.3

train:
  num_train_steps: 1000000
  seed_steps: 4000
  batch_size: 256
  replay_size: 1000000
  update_every_steps: 2
  gradient_steps: 1
  discount: 0.99

  replay_dir: ./buffer/metaworld/handle-press/cnn_w_crop/seed42/
  replay_num_workers: 4
  nstep: 3

  log_every_steps: 1000
  eval_every_steps: 10000
  num_eval_episodes: 120
  rolling_window: 10

  checkpoint_every_steps: 50000
  checkpoint_dir: ./checkpoints/metaworld/policies/drqv2/cnn_w_crop/handle-press/seed42/

visualization:
  enabled: false
  window_name: metaworld_handle-press_drqv2
  wait_key: 1
  scale: 1.0

