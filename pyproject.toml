[project]
name = "splatter-vae-droid"
version = "0.2.0"
description = "DROID temporal ViT-S pretraining with calibrated dynamic 3D Gaussians"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "gsplat>=1.5",
    "ninja>=1.11",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "pillow>=10.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rlds = [
    "tensorflow>=2.18",
    "tensorflow-datasets>=4.9.9",
]
teachers = [
    "einops>=0.8",
    "opencv-python>=4.9",
    "safetensors>=0.4",
    "timm>=1.0",
]
logging = ["wandb>=0.17"]
dev = ["pytest>=8.2"]

[tool.uv.extra-build-dependencies]
gsplat = ["torch"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
